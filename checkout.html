<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PayVora — Secure Checkout</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif}
:root{
  --dark:#0f172a;--dark-2:#1e293b;
  --blue:#3b82f6;--purple:#8b5cf6;--green:#10b981;
  --bg:#f0f4f9;--card:#fff;--border:#e5e7eb;
  --text:#0a0a0a;--muted:#6b7280;--muted-2:#94a3b8;
  --orange:#f59e0b;--red:#ef4444;
}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit}
::selection{background:var(--blue);color:#fff}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.1)}}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes qrReveal{from{opacity:0;transform:scale(.7) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0)}}

/* Layout */
.checkout-container{
  max-width:1080px;width:100%;margin:0 auto;
  background:#fff;border-radius:24px;overflow:hidden;
  box-shadow:0 30px 80px rgba(15,23,42,.15), 0 4px 20px rgba(15,23,42,.08);
  display:grid;grid-template-columns:400px 1fr;
  animation:fadeUp .7s cubic-bezier(.4,0,.2,1);
}

/* LEFT SIDE - Dark Panel */
.left-panel{
  background:linear-gradient(160deg,#0f172a 0%,#1e293b 60%,#0f172a 100%);
  color:#fff;padding:36px 32px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  animation:slideInLeft .7s ease .1s both;
}
.left-panel::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 80% 10%, rgba(59,130,246,.25), transparent 50%),
             radial-gradient(circle at 20% 90%, rgba(139,92,246,.2), transparent 50%);
  pointer-events:none;
}
.left-panel::after{
  content:'';position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,.15),transparent 70%);
  top:-100px;right:-100px;filter:blur(40px);animation:float 8s ease-in-out infinite;
}
.left-panel > *{position:relative;z-index:1}

.left-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-bottom:28px}
.left-head .logo-icon{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;object-fit:cover;
  box-shadow:0 8px 24px rgba(59,130,246,.4);
}
.left-head .text-gradient{
  background:linear-gradient(90deg,#60a5fa,#a78bfa);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-weight:800;
}

.paying-to{margin-bottom:24px}
.paying-to .lbl{font-size:10px;letter-spacing:2px;color:#94a3b8;font-weight:700;margin-bottom:6px;text-transform:uppercase}
.paying-to .store{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.paying-to .email{font-size:13px;color:#94a3b8}

/* Amount Display */
.amount-display{
  background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(139,92,246,.15));
  border:1px solid rgba(96,165,250,.25);
  border-radius:18px;padding:24px;text-align:center;
  position:relative;overflow:hidden;margin-bottom:24px;
  animation:scaleIn .6s ease .3s both;
}
.amount-display::before{
  content:'';position:absolute;top:0;left:-100%;right:0;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  animation:shimmer 3s infinite;
}
.amount-display .lbl{font-size:11px;letter-spacing:2px;color:#94a3b8;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.amount-display .amount{
  font-size:42px;font-weight:900;letter-spacing:-2px;
  background:linear-gradient(90deg,#60a5fa,#a78bfa);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1;
}
.amount-display .order-id{
  font-size:11px;color:#94a3b8;margin-top:10px;font-family:monospace;
  padding:4px 10px;background:rgba(0,0,0,.2);border-radius:99px;display:inline-block;
}

/* Breakdown */
.breakdown{margin-bottom:20px}
.breakdown .row{
  display:flex;justify-content:space-between;
  padding:10px 0;font-size:13px;color:#cbd5e1;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.breakdown .row:last-child{border:none;padding-top:14px;margin-top:6px;border-top:1px solid rgba(255,255,255,.1);font-size:16px;font-weight:800}
.breakdown .row .val{font-weight:700;color:#fff}
.breakdown .row.total .val{
  background:linear-gradient(90deg,#60a5fa,#a78bfa);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* Trust badges */
.trust-badges{display:flex;flex-wrap:wrap;gap:10px;font-size:10px;color:#64748b;margin-top:20px}
.trust-badges span{display:flex;align-items:center;gap:4px}

/* RIGHT SIDE */
.right-panel{
  padding:36px 40px;display:flex;flex-direction:column;
  animation:slideInRight .7s ease .1s both;
}
.right-panel h2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:24px}

/* Method Tabs */
.method-tabs{
  display:flex;gap:6px;background:#f1f5f9;border-radius:12px;
  padding:5px;margin-bottom:24px;
}
.method-tab{
  flex:1;padding:11px 12px;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--muted);transition:all .25s;display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;
}
.method-tab:hover{color:var(--text)}
.method-tab.active{
  background:#fff;color:var(--text);
  box-shadow:0 2px 8px rgba(0,0,0,.06);font-weight:700;
}
.method-tab .icon{font-size:14px}

/* Form */
.form-group{margin-bottom:20px;animation:fadeUp .5s ease .3s both}
.form-group label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:8px}
.form-group input{
  width:100%;padding:14px 16px;border:1.5px solid var(--border);
  border-radius:12px;font-size:14px;font-weight:500;outline:none;
  transition:all .2s;background:#fff;
}
.form-group input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.1)}
.form-group input::placeholder{color:#b0b5bd}

/* Amount input - big */
.amount-input-wrap{position:relative;margin-bottom:20px}
.amount-input-wrap .currency{
  position:absolute;left:18px;top:50%;transform:translateY(-50%);
  font-size:26px;font-weight:800;color:var(--muted);pointer-events:none;
}
.amount-input-wrap input{
  padding:22px 18px 22px 52px;font-size:26px;font-weight:800;letter-spacing:-.5px;
  border:2px solid var(--border);border-radius:14px;width:100%;
  outline:none;transition:all .25s;
}
.amount-input-wrap input:focus{border-color:var(--blue);box-shadow:0 0 0 5px rgba(59,130,246,.12)}

.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.quick-amounts button{
  padding:9px 16px;background:#f8fafc;border:1.5px solid var(--border);
  border-radius:99px;font-size:12px;font-weight:700;color:#475569;
  transition:all .2s;
}
.quick-amounts button:hover{
  border-color:var(--blue);background:#eff6ff;color:var(--blue);
  transform:translateY(-1px);
}

/* QR Section */
.qr-section{
  display:none;
  animation:qrReveal .5s cubic-bezier(.4,0,.2,1);
}
.qr-section.show{display:block}

.qr-frame{
  background:linear-gradient(135deg,#f8fafc,#eff6ff);
  border:2px dashed #cbd5e1;border-radius:16px;
  padding:24px;text-align:center;margin-bottom:20px;
  transition:all .3s;
}
.qr-frame:hover{border-color:var(--blue)}
.qr-frame img{
  width:220px;height:220px;object-fit:contain;
  background:#fff;padding:12px;border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
  transition:transform .3s;
}
.qr-frame img:hover{transform:scale(1.03)}

.upi-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;background:#f8fafc;border-radius:12px;
  margin-bottom:10px;font-size:13px;
  border:1px solid var(--border);transition:all .2s;
}
.upi-row:hover{border-color:var(--blue);background:#eff6ff}
.upi-row .lbl{color:var(--muted);font-weight:600}
.upi-row .val{
  font-weight:700;font-family:monospace;
  cursor:pointer;display:flex;align-items:center;gap:6px;
}
.upi-row .val:hover{color:var(--blue)}

/* Steps */
.mini-steps{
  background:#f8fafc;border-radius:14px;padding:18px;margin-top:16px;
}
.mini-step{display:flex;gap:12px;padding:10px 0;font-size:13px;color:#475569}
.mini-step:not(:last-child){border-bottom:1px solid #e2e8f0}
.mini-step .num{
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;
  font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.mini-step .text{line-height:1.5;padding-top:2px}
.mini-step .text b{color:var(--blue)}

/* Generate button */
.btn-generate{
  width:100%;padding:18px;border-radius:14px;font-weight:800;font-size:15px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;
  cursor:pointer;transition:all .3s;letter-spacing:.3px;
  position:relative;overflow:hidden;
  box-shadow:0 8px 24px rgba(59,130,246,.35);
}
.btn-generate:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(59,130,246,.45);
}
.btn-generate:active{transform:translateY(0)}
.btn-generate:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}

/* Submit button */
.btn-submit{
  width:100%;padding:16px;border-radius:14px;font-weight:800;font-size:14px;
  background:linear-gradient(135deg,#10b981,#059669);color:#fff;
  cursor:pointer;transition:all .3s;margin-top:8px;
  box-shadow:0 8px 24px rgba(16,185,129,.3);
}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.4)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* Loading */
.spinner{
  display:inline-block;width:16px;height:16px;
  border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;
  margin-right:8px;vertical-align:middle;
}

/* Success */
.success-wrap{
  padding:60px 40px;text-align:center;
  animation:scaleIn .5s cubic-bezier(.4,0,.2,1);
}
.success-icon{
  width:90px;height:90px;border-radius:50%;
  background:linear-gradient(135deg,#10b981,#059669);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;color:#fff;margin:0 auto 24px;
  box-shadow:0 20px 50px rgba(16,185,129,.4);
  animation:scaleIn .6s ease .1s both;
}
.success-wrap h2{font-size:28px;font-weight:800;margin-bottom:10px;letter-spacing:-.5px}
.success-wrap p{color:var(--muted);font-size:14px;line-height:1.6;max-width:400px;margin:0 auto 24px}

.order-box{
  background:#f8fafc;border:1px solid var(--border);
  border-radius:16px;padding:22px;max-width:420px;margin:0 auto 24px;
  text-align:left;
}
.order-box .row{
  display:flex;justify-content:space-between;
  padding:10px 0;font-size:13px;
  border-bottom:1px solid #e2e8f0;
}
.order-box .row:last-child{border:none}
.order-box .lbl{color:var(--muted);font-weight:500}
.order-box .val{font-weight:700;color:var(--text)}

.btn-close{
  padding:14px 32px;background:var(--dark);color:#fff;
  border-radius:12px;font-weight:700;font-size:14px;
  transition:all .25s;
}
.btn-close:hover{background:#1f2937;transform:translateY(-1px)}

/* Error */
.error-wrap{padding:60px 40px;text-align:center}
.error-icon{
  width:90px;height:90px;border-radius:50%;
  background:linear-gradient(135deg,#fee2e2,#fecaca);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;color:var(--red);margin:0 auto 24px;
}
.error-wrap h2{font-size:24px;font-weight:800;margin-bottom:10px}
.error-wrap p{color:var(--muted);font-size:14px;line-height:1.6;max-width:400px;margin:0 auto}

/* Loading */
.loading-wrap{padding:80px 40px;text-align:center}
.loading-spinner{
  width:48px;height:48px;border:3px solid var(--border);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 20px;
}

/* Toast */
.toast{
  position:fixed;top:24px;right:24px;
  background:var(--dark);color:#fff;padding:14px 22px;
  border-radius:12px;font-size:13px;font-weight:600;
  z-index:9999;transform:translateX(300%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  box-shadow:0 20px 60px rgba(0,0,0,.2);
  max-width:340px;
}
.toast.show{transform:translateX(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

/* Mobile */
@media(max-width:900px){
  body{padding:0}
  .checkout-container{
    grid-template-columns:1fr;border-radius:0;
    min-height:100vh;max-width:100%;
  }
  .left-panel{padding:28px 22px;border-radius:0 0 24px 24px}
  .paying-to .store{font-size:18px}
  .amount-display .amount{font-size:34px}
  .amount-display{padding:20px}
  .right-panel{padding:28px 22px}
  .right-panel h2{font-size:20px}
  .method-tab{font-size:11px;padding:10px 6px}
  .method-tab .icon{font-size:12px}
  .qr-frame img{width:200px;height:200px}
  .amount-input-wrap input{font-size:22px;padding:18px 16px 18px 46px}
  .amount-input-wrap .currency{font-size:22px;left:14px}
}
</style>
</head>
<body>

<div class="checkout-container" id="app">
  <div class="loading-wrap" style="grid-column:1/-1">
    <div class="loading-spinner"></div>
    <p style="color:var(--muted);font-size:14px;">Loading secure checkout...</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   FIREBASE CONFIG
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDxrqWXt-GKk-RVHoCA8kPdwYU5VVG-ezg",
  authDomain: "payvora-pg.firebaseapp.com",
  projectId: "payvora-pg",
  storageBucket: "payvora-pg.firebasestorage.app",
  messagingSenderId: "913823472620",
  appId: "1:913823472620:web:46c1389e70a011a77fbec9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const DB = {
  async get(coll, id){
    try{ const d = await db.collection(coll).doc(id).get(); return d.exists ? d.data() : null; }
    catch(e){ console.error(e); return null; }
  },
  async push(coll, data){
    try{ const ref = await db.collection(coll).add(data); return ref.id; }
    catch(e){ console.error(e); return null; }
  }
};

/* =========================================================
   PARAMS
   ========================================================= */
const params = new URLSearchParams(window.location.search);
const merchant = (params.get("merchant") || "").trim().toLowerCase();
const preAmount = parseFloat(params.get("amount") || "0");
const orderId = params.get("order") || params.get("order_id") || ("ORD_" + Date.now().toString(36).toUpperCase());

let MERCHANT = null;
let SETTINGS = {};
let activeMethod = "qr";

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  const app = document.getElementById("app");

  if(!merchant){
    app.innerHTML = errorPage("Invalid Payment Link", "Ye link sahi nahi hai. Kripya merchant se naya link lein.");
    app.style.gridTemplateColumns = "1fr";
    return;
  }

  const m = await DB.get("merchants", merchant);
  if(!m){
    app.innerHTML = errorPage("Merchant Not Found", `Merchant "${merchant}" PayVora pe registered nahi hai.`);
    app.style.gridTemplateColumns = "1fr";
    return;
  }
  MERCHANT = m;

  const mySettings = (await DB.get("merchantSettings", merchant)) || {};
  const globalSettings = (await DB.get("paySettings","config")) || {};
  SETTINGS = {
    upiId: mySettings.upiId || globalSettings.upiId || "",
    payeeName: mySettings.payeeName || globalSettings.payeeName || m.name || "Merchant",
    qrUrl: mySettings.qrUrl || globalSettings.qrUrl || ""
  };

  if(!SETTINGS.upiId && !SETTINGS.qrUrl){
    app.innerHTML = errorPage("Payment Not Configured", "Merchant ne abhi UPI/QR setup nahi kiya. Kripya merchant se contact karein.");
    app.style.gridTemplateColumns = "1fr";
    return;
  }

  renderCheckout();
})();

/* =========================================================
   RENDER
   ========================================================= */
function renderCheckout(){
  const app = document.getElementById("app");
  const initialAmount = preAmount > 0 ? preAmount : 0;

  app.innerHTML = `
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div>
        <div class="left-head">
          <img src="https://raw.githubusercontent.com/payvoraa/payvora-payment-getway/main/logo.png" class="logo-icon" onerror="this.outerHTML='<div class=&quot;logo-icon&quot;>◆</div>'"/>
          <span class="text-gradient">PayVora Secure Checkout</span>
        </div>

        <div class="paying-to">
          <div class="lbl">Paying To</div>
          <div class="store">${escapeHtml(MERCHANT.name || merchant)}</div>
          <div class="email">${escapeHtml(merchant)}</div>
        </div>

        <div class="amount-display">
          <div class="lbl">Amount Payable</div>
          <div class="amount" id="bigAmount">₹${initialAmount > 0 ? formatAmount(initialAmount) : "0"}</div>
          <div class="order-id" id="orderIdDisplay">Order: ${escapeHtml(orderId)}</div>
        </div>

        <div class="breakdown">
          <div class="row"><span>Subtotal</span><span class="val" id="bdSubtotal">₹${initialAmount > 0 ? formatAmount(initialAmount) : "0"}</span></div>
          <div class="row"><span>Processing Fee</span><span class="val" style="color:#4ade80;">FREE</span></div>
          <div class="row total"><span>Total</span><span class="val" id="bdTotal">₹${initialAmount > 0 ? formatAmount(initialAmount) : "0"}</span></div>
        </div>
      </div>

      <div class="trust-badges">
        <span>🔒 256-bit SSL</span>
        <span>✅ PCI-DSS</span>
        <span>⚡ Instant</span>
        <span>💎 UPI Ready</span>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <h2>Choose Payment Method</h2>

      <div class="method-tabs">
        <div class="method-tab active" data-method="qr" onclick="switchMethod('qr',this)">
          <span class="icon">📱</span> UPI / QR
        </div>
        <div class="method-tab" data-method="intent" onclick="switchMethod('intent',this)">
          <span class="icon">🎯</span> Intent
        </div>
      </div>

      <div class="form-group">
        <label>Amount (₹)</label>
        <div class="amount-input-wrap">
          <span class="currency">₹</span>
          <input id="amountInput" type="number" min="1" step="1" placeholder="0" value="${initialAmount > 0 ? initialAmount : ''}" oninput="onAmountChange()"/>
        </div>
        <div class="quick-amounts">
          <button onclick="setAmount(100)">₹100</button>
          <button onclick="setAmount(500)">₹500</button>
          <button onclick="setAmount(1000)">₹1,000</button>
          <button onclick="setAmount(2000)">₹2,000</button>
          <button onclick="setAmount(5000)">₹5,000</button>
        </div>
      </div>

      <div id="qrSection" class="qr-section ${initialAmount > 0 ? 'show' : ''}">
        <div class="qr-frame">
          <img src="${SETTINGS.qrUrl || ''}" onerror="this.outerHTML='<div style=&quot;width:220px;height:220px;background:#f1f5f9;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px;margin:0 auto;&quot;>QR not set</div>'"/>
          <p style="font-size:12px;color:var(--muted);margin-top:12px;">Scan with any UPI app</p>
        </div>

        ${SETTINGS.upiId ? `
        <div class="upi-row">
          <span class="lbl">UPI ID</span>
          <span class="val" onclick="copyText('${SETTINGS.upiId}',this)">${SETTINGS.upiId} 📋</span>
        </div>
        <div class="upi-row">
          <span class="lbl">Payee Name</span>
          <span class="val">${escapeHtml(SETTINGS.payeeName)}</span>
        </div>` : ''}

        <div class="mini-steps">
          <div class="mini-step"><div class="num">1</div><div class="text">QR scan karo ya UPI ID copy karo</div></div>
          <div class="mini-step"><div class="num">2</div><div class="text">Exact <b>₹<span id="stepAmount">${initialAmount > 0 ? formatAmount(initialAmount) : "0"}</span></b> pay karo</div></div>
          <div class="mini-step"><div class="num">3</div><div class="text">Payment ke baad UTR / Reference number copy karo</div></div>
        </div>
      </div>

      <div class="form-group" style="margin-top:24px;">
        <label>UTR / Transaction ID *</label>
        <input id="utrInput" placeholder="12-digit UTR from your UPI app"/>
      </div>

      <button class="btn-submit" id="submitBtn" onclick="submitPayment()">
        ✅ I've Paid — Submit
      </button>

      <p style="font-size:11px;color:var(--muted);margin-top:16px;text-align:center;line-height:1.5;">
        Payment manually verified hoga. Aapko email/SMS pe update milega.
      </p>
    </div>
  `;
}

/* =========================================================
   HELPERS
   ========================================================= */
function formatAmount(n){
  return Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:0,maximumFractionDigits:2});
}

function switchMethod(method, el){
  activeMethod = method;
  document.querySelectorAll(".method-tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  showToast(method === "qr" ? "QR mode selected" : "UPI Intent mode selected");
}

function setAmount(v){
  const inp = document.getElementById("amountInput");
  inp.value = v;
  onAmountChange();
  inp.focus();
}

function onAmountChange(){
  const val = parseFloat(document.getElementById("amountInput").value) || 0;
  const sec = document.getElementById("qrSection");
  const big = document.getElementById("bigAmount");
  const bdSub = document.getElementById("bdSubtotal");
  const bdTot = document.getElementById("bdTotal");
  const step = document.getElementById("stepAmount");

  const formatted = "₹" + formatAmount(val);
  if(big) big.textContent = formatted;
  if(bdSub) bdSub.textContent = formatted;
  if(bdTot) bdTot.textContent = formatted;
  if(step) step.textContent = formatAmount(val);

  if(val > 0){ sec.classList.add("show"); }
  else { sec.classList.remove("show"); }
}

async function submitPayment(){
  const amount = parseFloat(document.getElementById("amountInput").value) || 0;
  const utr = document.getElementById("utrInput").value.trim();
  const btn = document.getElementById("submitBtn");

  if(!amount || amount <= 0) return showToast("Please enter amount first","error");
  if(!utr || utr.length < 6) return showToast("Please enter valid UTR (min 6 chars)","error");

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Submitting...';

  try{
    const depositId = await DB.push("deposits", {
      email: merchant,
      merchant: merchant,
      amount: amount,
      utr: utr,
      orderId: orderId,
      source: "checkout",
      method: activeMethod,
      status: "pending",
      at: new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})
    });
    if(!depositId) throw new Error("Could not save payment");
    showSuccess(utr, amount);
  }catch(e){
    console.error(e);
    btn.disabled = false;
    btn.innerHTML = '✅ I\'ve Paid — Submit';
    showToast("Error: " + e.message, "error");
  }
}

function showSuccess(utr, amount){
  const app = document.getElementById("app");
  app.style.gridTemplateColumns = "1fr";
  app.innerHTML = `
    <div class="success-wrap" style="grid-column:1/-1">
      <div class="success-icon">✓</div>
      <h2>Payment Submitted!</h2>
      <p>Aapki payment details receive ho gayi. Merchant verify karke confirm karega.</p>

      <div class="order-box">
        <div class="row"><span class="lbl">Order ID</span><span class="val">${escapeHtml(orderId)}</span></div>
        <div class="row"><span class="lbl">Amount</span><span class="val" style="color:var(--green);">₹${formatAmount(amount)}</span></div>
        <div class="row"><span class="lbl">UTR</span><span class="val" style="font-family:monospace;font-size:12px;">${escapeHtml(utr)}</span></div>
        <div class="row"><span class="lbl">Status</span><span class="val" style="color:var(--orange);">⏳ Pending Verification</span></div>
      </div>

      <p style="font-size:12px;color:var(--muted);max-width:400px;margin:0 auto 24px;">
        Kripya is page ka screenshot le lein.
      </p>

      <button class="btn-close" onclick="window.close()">Close Window</button>
    </div>
  `;
  window.scrollTo(0,0);
}

function errorPage(title, msg){
  return `
    <div class="error-wrap" style="grid-column:1/-1">
      <div class="error-icon">✕</div>
      <h2>${title}</h2>
      <p>${msg}</p>
    </div>
  `;
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function copyText(text, el){
  navigator.clipboard.writeText(text).then(()=>{
    const orig = el.textContent;
    el.textContent = "✅ Copied!";
    setTimeout(()=>el.textContent = orig, 1500);
    showToast("Copied: " + text, "success");
  }).catch(()=>{ showToast("UPI ID: " + text); });
}

function showToast(m, t=""){
  const el = document.getElementById("toast");
  el.textContent = m;
  el.className = "toast show " + t;
  setTimeout(()=>el.className = "toast " + t, 3000);
}
</script>
</body>
</html>
