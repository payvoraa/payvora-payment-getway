<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Secure Checkout</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--blue:#3b82f6;--purple:#8b5cf6;--green:#10b981;--border:#e5e7eb;--text:#0a0a0a;--muted:#6b7280;--orange:#f59e0b;--red:#ef4444}
html,body{overflow-x:hidden}
body{background:linear-gradient(135deg,#eef2f8 0%,#f5f7fb 50%,#eef2f8 100%);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes qrReveal{from{opacity:0;transform:scale(.85) rotate(-6deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes qrPulse{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.08),0 0 0 0 rgba(59,130,246,.4)}50%{box-shadow:0 10px 30px rgba(0,0,0,.08),0 0 0 12px rgba(59,130,246,0)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.75}}
@keyframes dotBounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

.checkout-wrap{max-width:520px;width:100%;margin:0 auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(10,15,30,.12);animation:fadeUp .7s cubic-bezier(.4,0,.2,1);position:relative}

.header{padding:28px 28px 22px;text-align:center;border-bottom:1px solid #f0f2f7}
.header .shop-icon{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin:0 auto 14px;box-shadow:0 12px 30px rgba(59,130,246,.35)}
.header h1{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.header .merchant-name{font-size:13px;color:var(--muted);font-weight:600}
.header .amount-big{font-size:40px;font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:16px;line-height:1}

.body{padding:24px 28px 28px}

.amount-input-wrap{position:relative;margin-bottom:14px}
.amount-input-wrap .currency{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:26px;font-weight:800;color:#cbd5e1;pointer-events:none;transition:color .25s}
.amount-input-wrap input{padding:20px 18px 20px 52px;font-size:26px;font-weight:800;letter-spacing:-1px;border:2px solid var(--border);border-radius:16px;width:100%;outline:none;transition:all .25s;background:#fafbfd}
.amount-input-wrap input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 5px rgba(59,130,246,.14)}
.amount-input-wrap:focus-within .currency{color:var(--blue)}

.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.quick-amounts button{padding:9px 16px;background:#f8fafc;border:1.5px solid var(--border);border-radius:99px;font-size:12.5px;font-weight:700;color:#475569;transition:all .2s}
.quick-amounts button:hover{border-color:var(--blue);background:#eff6ff;color:var(--blue);transform:translateY(-2px)}
.quick-amounts button.active{background:var(--blue);color:#fff;border-color:var(--blue)}

.upi-section{animation:fadeUp .6s ease .2s both}
.upi-head{font-size:13px;font-weight:800;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.upi-head .badge{font-size:10px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3b82f6,#8b5cf6);padding:4px 10px;border-radius:99px;letter-spacing:.5px}

.upi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.upi-card{background:#fff;border:1.5px solid var(--border);border-radius:13px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .25s;text-decoration:none;color:var(--text);position:relative}
.upi-card:hover{border-color:var(--blue);background:#f8faff;transform:translateY(-3px);box-shadow:0 10px 24px rgba(59,130,246,.15)}
.upi-card:active{transform:translateY(0) scale(.97)}
.upi-card .upi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;overflow:hidden}
.upi-card .upi-icon svg{width:24px;height:24px;display:block}
.upi-card .upi-name{font-size:10.5px;font-weight:700;color:#374151;text-align:center;line-height:1.2}
.upi-card .upi-arrow{position:absolute;top:6px;right:6px;font-size:10px;color:#cbd5e1}

.bg-gpay{background:#fff;border:1px solid #e5e7eb}
.bg-phonepe{background:#5f259f}
.bg-paytm{background:linear-gradient(135deg,#00baf2,#002e6e)}
.bg-bhim{background:#fff;border:1px solid #e5e7eb}
.bg-amazonpay{background:#fff;border:1px solid #e5e7eb}
.bg-whatsapp{background:#25D366}
.bg-cred{background:#000}
.bg-navi{background:#3d1a5b}
.bg-other{background:#eef4fd;border:1px solid #dbeafe}
.bg-other .dots{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.bg-other .dots span{width:6px;height:6px;background:#2563eb;border-radius:2px}

.other-upi{display:flex;align-items:center;gap:12px;padding:13px 16px;background:#fff;border:1.5px solid var(--border);border-radius:13px;cursor:pointer;transition:all .25s;text-decoration:none;color:var(--text);margin-bottom:18px;position:relative}
.other-upi:hover{border-color:var(--blue);background:#f8faff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,.12)}
.other-upi .other-icon{width:40px;height:40px;background:#eef4fd;border-radius:11px;display:flex;align-items:center;justify-content:center}
.other-upi .other-icon .dots{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.other-upi .other-icon .dots span{width:7px;height:7px;background:#2563eb;border-radius:2px}
.other-upi .other-name{flex:1;font-size:13.5px;font-weight:700}
.other-upi .mascot{width:32px;height:32px}

.qr-box{background:linear-gradient(135deg,#f8fafc,#eff6ff);border:2px dashed #cbd5e1;border-radius:16px;padding:22px;text-align:center;margin-bottom:18px;position:relative;transition:all .3s;display:none}
.qr-box.show{display:block;animation:qrReveal .55s cubic-bezier(.4,0,.2,1)}
.qr-box:hover{border-color:var(--blue)}
.qr-box .qr-tag{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.5px}
#qrTarget{width:210px;height:210px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:14px;color:#94a3b8;font-size:12px;transition:all .3s}
#qrTarget.ready{background:#fff;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);animation:qrPulse 2.5s ease-in-out infinite}
#qrTarget img,#qrTarget canvas{display:block;border-radius:6px}
.qr-box .qr-amt{font-size:14px;font-weight:800;color:var(--blue);margin-top:10px}
.qr-box p{font-size:11.5px;color:var(--muted);margin-top:4px}

.pay-btn{width:100%;padding:16px;border-radius:14px;font-weight:800;font-size:15px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;cursor:pointer;transition:all .3s;letter-spacing:.3px;box-shadow:0 10px 28px rgba(16,185,129,.35);margin-top:6px}
.pay-btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(16,185,129,.45)}
.pay-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}

.note{font-size:11px;color:var(--muted);margin-top:12px;text-align:center;line-height:1.55}

/* WAITING SCREEN — simple, no text about admin */
.waiting-screen{padding:60px 30px;text-align:center;animation:scaleIn .6s cubic-bezier(.4,0,.2,1)}
.waiting-spinner{width:80px;height:80px;border:4px solid #e5ebf3;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 28px;position:relative}
.waiting-spinner::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:3px solid rgba(59,130,246,.15);animation:pulse 1.8s ease-in-out infinite}
.waiting-screen h2{font-size:22px;font-weight:800;margin-bottom:10px;letter-spacing:-.5px}
.waiting-screen p{color:var(--muted);font-size:13.5px;line-height:1.6;max-width:340px;margin:0 auto}
.waiting-dots{display:inline-flex;gap:5px;margin-top:16px}
.waiting-dots span{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:dotBounce 1.4s infinite ease-in-out both}
.waiting-dots span:nth-child(1){animation-delay:-.32s}
.waiting-dots span:nth-child(2){animation-delay:-.16s}
.waiting-dots span:nth-child(3){animation-delay:0s}

/* SUCCESS SCREEN */
.success-screen{padding:50px 30px;text-align:center;animation:scaleIn .55s cubic-bezier(.4,0,.2,1)}
.success-icon{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;margin:0 auto 24px;box-shadow:0 20px 50px rgba(16,185,129,.4)}
.success-screen h2{font-size:26px;font-weight:800;margin-bottom:10px;letter-spacing:-.6px}
.success-screen p{color:var(--muted);font-size:13.5px;line-height:1.65;max-width:340px;margin:0 auto 24px}
.success-box{background:#f8fafc;border:1px solid var(--border);border-radius:16px;padding:20px;max-width:380px;margin:0 auto 22px;text-align:left}
.success-box .row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;font-size:13px;border-bottom:1px solid #e2e8f0}
.success-box .row:last-child{border:none}
.success-box .lbl{color:var(--muted);font-weight:500}
.success-box .val{font-weight:700;color:var(--text);text-align:right;word-break:break-all}
.success-btn{padding:14px 32px;background:#0a0f1e;color:#fff;border-radius:13px;font-weight:700;font-size:14px;transition:all .25s}
.success-btn:hover{background:#1f2937;transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.15)}

/* ERROR SCREEN */
.error-screen{padding:60px 30px;text-align:center}
.error-icon{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#fee2e2,#fecaca);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--red);margin:0 auto 24px}
.error-screen h2{font-size:22px;font-weight:800;margin-bottom:12px}
.error-screen p{color:var(--muted);font-size:13.5px;line-height:1.65;max-width:340px;margin:0 auto}

.loading-wrap{padding:80px 30px;text-align:center}
.loading-spinner{width:52px;height:52px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 22px}

@media(max-width:768px){
  body{padding:16px 12px}
  .checkout-wrap{border-radius:20px}
  .header{padding:24px 22px 18px}
  .header .amount-big{font-size:34px}
  .body{padding:20px 22px 24px}
  .amount-input-wrap input{font-size:24px;padding:18px 16px 18px 48px}
  .amount-input-wrap .currency{font-size:24px;left:16px}
  .upi-grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .upi-card{padding:10px 4px;border-radius:11px;gap:5px}
  .upi-card .upi-icon{width:34px;height:34px;border-radius:9px}
  .upi-card .upi-icon svg{width:22px;height:22px}
  .upi-card .upi-name{font-size:10px}
  #qrTarget{width:190px;height:190px}
  .waiting-screen{padding:50px 22px}
  .waiting-spinner{width:70px;height:70px}
  .success-screen{padding:44px 22px}
  .success-icon{width:80px;height:80px;font-size:40px}
  .success-screen h2{font-size:22px}
}
</style>
</head>
<body>

<div class="checkout-wrap" id="app">
  <div class="loading-wrap">
    <div class="loading-spinner"></div>
    <p style="color:var(--muted);font-size:13px;">Loading...</p>
  </div>
</div>

<script>
/* =========================================================
   FIREBASE CONFIG — tumhara same config
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDxrqWXt-GKk-RVHoCA8kPdwYU5VVG-ezg",
  authDomain: "payvora-pg.firebaseapp.com",
  projectId: "payvora-pg",
  storageBucket: "payvora-pg.firebasestorage.app",
  messagingSenderId: "913823472620",
  appId: "1:913823472620:web:46c1389e70a011a77fbec9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const DB = {
  async get(coll, id){
    try{ const d = await db.collection(coll).doc(id).get(); return d.exists ? d.data() : null; }
    catch(e){ console.error(e); return null; }
  },
  async push(coll, data){
    try{ const ref = await db.collection(coll).add(data); return ref.id; }
    catch(e){ console.error(e); return null; }
  }
};

/* =========================================================
   URL PARAMS
   ========================================================= */
const params = new URLSearchParams(window.location.search);
const merchant = (params.get("merchant") || "").trim().toLowerCase();
const preAmount = parseFloat(params.get("amount") || "0");
const orderId = params.get("order") || params.get("order_id") || ("ORD_" + Date.now().toString(36).toUpperCase());

let MERCHANT = null;
let SETTINGS = {};
let activeMethod = "qr";
let currentDepositId = null;
let unsubscribeListener = null;

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  const app = document.getElementById("app");

  if(!merchant){
    app.innerHTML = errorScreen("Invalid Link", "This payment link is invalid. Please contact the merchant.");
    return;
  }

  const m = await DB.get("merchants", merchant);
  if(!m){
    app.innerHTML = errorScreen("Not Found", "This payment page is not available.");
    return;
  }
  MERCHANT = m;

  const mySettings = (await DB.get("merchantSettings", merchant)) || {};
  const globalSettings = (await DB.get("paySettings","config")) || {};
  SETTINGS = {
    upiId: mySettings.upiId || globalSettings.upiId || "",
    payeeName: mySettings.payeeName || globalSettings.payeeName || m.name || "Merchant",
    qrUrl: mySettings.qrUrl || globalSettings.qrUrl || ""
  };

  if(!SETTINGS.upiId && !SETTINGS.qrUrl){
    app.innerHTML = errorScreen("Payment Not Available", "This merchant hasn't set up payments yet.");
    return;
  }

  renderCheckout();
})();

/* =========================================================
   RENDER CHECKOUT
   ========================================================= */
function renderCheckout(){
  const app = document.getElementById("app");
  const initialAmount = preAmount > 0 ? preAmount : 0;

  app.innerHTML = `
    <div class="header">
      <div class="shop-icon">🛍️</div>
      <h1>Secure Checkout</h1>
      <div class="merchant-name">${escapeHtml(MERCHANT.name || "Merchant")}</div>
      <div class="amount-big" id="bigAmount">₹${initialAmount > 0 ? formatAmount(initialAmount) : "0"}</div>
    </div>

    <div class="body">
      <div class="amount-input-wrap">
        <span class="currency">₹</span>
        <input id="amountInput" type="number" min="1" step="1" placeholder="0" value="${initialAmount > 0 ? initialAmount : ''}" oninput="onAmountChange()"/>
      </div>

      <div class="quick-amounts">
        <button onclick="setAmount(100)">₹100</button>

      <div class="upi-section">

        </div>

        <div class="upi-grid">
          <a href="javascript:void(0)" class="upi-card" onclick="payVia('gpay',event)">
            <div class="upi-icon bg-gpay">
              <svg viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.5-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 5.1 29.3 3 24 3 16.3 3 9.7 7.4 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36.1 26.7 37 24 37c-5.3 0-9.7-2.6-11.3-7l-6.5 5C9.5 40.5 16.2 45 24 45z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.2 5.2C41.9 35.3 45 30.1 45 24c0-1.4-.1-2.5-.4-3.5z"/>

            </div>
            <span class="upi-name">GPay</span>
            <span class="upi-arrow">↗</span>
          </a>

          <a href="javascript:void(0)" class="upi-card" onclick="payVia('phonepe',event)">
            <div class="upi-icon bg-phonepe">
              <svg viewBox="0 0 24 24" fill="#fff"><path d="M17.5 6.5h-2.7l-1.4-1.4c-.2-.2-.5-.3-.7-.3H7.8c-.3 0-.5.2-.5.5v1.2H6c-.3 0-.5.2-.5.5v10c0 .3.2.5.5.5h6.1c.3 0 .6-.1.8-.3l1.2-1.2h3.4c.3 0 .5-.2.5-.5v-8c0-.3-.2-.5-.5-.5zM9.2 8.5v8H7.5v-8h1.7zm5.2 6.2l-.9.9v-7h.9v6.1z"/></svg>
            </div>
            <span class="upi-name">PhonePe</span>

          </a>

          <a href="javascript:void(0)" class="upi-card" onclick="payVia('paytm',event)">
            <div class="upi-icon bg-paytm">
              <svg viewBox="0 0 40 24"><text x="2" y="17" font-family="Arial" font-size="13" font-weight="bold" fill="#fff">paytm</text></svg>
            </div>
            <span class="upi-name">Paytm</span>
            <span class="upi-arrow">↗</span>
          </a>

          <a href="javascript:void(0)" class="upi-card" onclick="payVia('any',event)">
            <div class="upi-icon bg-bhim">
              <svg viewBox="0 0 40 40"><path fill="#f26522" d="M6 30L20 8l5 8-9 14z"/><path fill="#00a651" d="M20 8l14 22h-9l-9-14z"/></svg>
            </div>
            <span class="upi-name">BHIM</span>
            <span class="upi-arrow">↗</span>
          </a>

          <a href="javascript:void(0)" class="upi-card" onclick="payVia('amazonpay',event)">
            <div class="upi-icon bg-amazonpay">
              <svg viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="6" fill="#FF9900"/><path d="M10 24c6 4 14 4 20 0" stroke="#131A22" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M28 24l3 0 0 3" stroke="#131A22" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <span class="upi-name">Amazon</span>
            <span class="upi-arrow">↗</span>
          </a>

          <a href="javascript:void(0)" class="upi-card" onclick="payVia('whatsapp',event)">
            <div class="upi-icon bg-whatsapp">
              <svg viewBox="0 0 24 24" fill="#fff"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
            </div>

  if(initialAmount > 0) updateQr(initialAmount);
}

function formatAmount(n){
  return Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:0,maximumFractionDigits:2});
}

function setAmount(v){
  const inp = document.getElementById("amountInput");
  inp.value = v;
  onAmountChange();
  inp.focus();
}

function onAmountChange(){
  const val = parseFloat(document.getElementById("amountInput").value) || 0;
  const qrBox = document.getElementById("qrBox");
  const big = document.getElementById("bigAmount");
  const payBtn = document.getElementById("payBtn");

  const formatted = "₹" + formatAmount(val);
  if(big) big.textContent = formatted;

  if(val > 0){
    qrBox.classList.add("show");
    updateQr(val);
    payBtn.disabled = false;
    payBtn.textContent = `🔒 Pay ${formatted}`;
  } else {
    qrBox.classList.remove("show");
    payBtn.disabled = true;
    payBtn.textContent = "🔒 Pay ₹0";
  }
}

/* =========================================================
   QR GENERATION
   ========================================================= */
function updateQr(amount){
  const container = document.getElementById("qrTarget");
  const label = document.getElementById("qrAmtLabel");
  if(!container) return;

  if(!SETTINGS.upiId){
    container.classList.remove("ready");
    container.innerHTML = 'UPI not available';
    return;
  }

  if(!amount || amount <= 0){
    container.classList.remove("ready");
    container.innerHTML = 'Enter amount to generate QR';
    return;
  }

  const pa = SETTINGS.upiId;
  const pn = encodeURIComponent(SETTINGS.payeeName || "Merchant");
  const am = Number(amount).toFixed(2);
  const tn = encodeURIComponent("Payment " + orderId);
  const upiLink = `upi://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=INR`;

  container.innerHTML = '';

  if(typeof QRCode === "undefined"){
    container.innerHTML = 'QR loading...';
    return;
  }

  try{
    new QRCode(container, {
      text: upiLink,
      width: 186,
      height: 186,
      colorDark: "#0a0a0a",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
    container.classList.add("ready");
    if(label) label.textContent = "₹" + formatAmount(amount);
  }catch(e){
    console.error(e);
    container.innerHTML = 'QR generation failed';
  }
}

/* =========================================================
   PAYMENT — UPI app kholo, phir waiting screen
   ========================================================= */
function payVia(app, event){
  if(event) event.preventDefault();
  const amount = parseFloat(document.getElementById("amountInput").value) || 0;
  if(!amount || amount <= 0){
    alert("Please enter amount first");
    return;
  }
  if(!SETTINGS.upiId){
    alert("Payment not available");
    return;
  }

  const pa = SETTINGS.upiId;
  const pn = encodeURIComponent(SETTINGS.payeeName || "Merchant");
  const am = amount.toFixed(2);
  const tn = encodeURIComponent("Payment " + orderId);
  const cu = "INR";

  const appLinks = {
    gpay:      `tez://upi/pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=${cu}`,
    phonepe:   `phonepe://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=${cu}`,
    paytm:     `paytmmp://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=${cu}`,
    amazonpay: `amazonpay://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=${cu}`,
    whatsapp:  `whatsapp://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=${cu}`,
    cred:      `credpay://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=${cu}`,
    navi:      `navi://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=${cu}`,
    any:       `upi://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=${cu}`
  };

  activeMethod = app;
  const upiLink = appLinks[app] || appLinks.any;

  // Save pending payment to Firebase FIRST
  createPendingPayment(amount, app);

  // Open UPI app
  try{
    window.location.href = upiLink;
  }catch(e){
    window.location.href = appLinks.any;
  }
}

/* Confirm payment button — QR scan karne walon ke liye */
function confirmPayment(){
  const amount = parseFloat(document.getElementById("amountInput").value) || 0;
  if(!amount || amount <= 0){
    alert("Please enter amount first");
    return;
  }
  createPendingPayment(amount, "qr");
}

/* =========================================================
   CREATE PENDING PAYMENT → WAITING SCREEN → LISTENER
   ========================================================= */
async function createPendingPayment(amount, method){
  // Save to Firestore
  const depositId = await DB.push("deposits", {
    email: merchant,
    merchant: merchant,
    amount: amount,
    utr: "",  // NO UTR
    orderId: orderId,
    source: "checkout",
    method: method,
    status: "pending",
    at: new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}),
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    timestamp: Date.now()
  });

  if(!depositId){
    alert("Could not create payment. Please try again.");
    return;
  }

  currentDepositId = depositId;
  showWaitingScreen(amount);

  // Listen for admin approval
  startStatusListener(depositId, amount);
}

/* =========================================================
   WAITING SCREEN (simple, no timer, no admin text)
   ========================================================= */
function showWaitingScreen(amount){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="waiting-screen">
      <div class="waiting-spinner"></div>
      <h2>Processing Payment</h2>
      <p>Please wait while we confirm your payment...</p>
      <div class="waiting-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

/* =========================================================
   FIREBASE REAL-TIME LISTENER
   — jaise hi admin status "approved" karega, success dikhega
   ========================================================= */
function startStatusListener(depositId, amount){
  if(unsubscribeListener) unsubscribeListener();

  unsubscribeListener = db.collection("deposits").doc(depositId)
    .onSnapshot((doc) => {
      if(!doc.exists) return;
      const data = doc.data();

      // status === success / approved / completed → success screen
      if(data.status === "success" || data.status === "approved" || data.status === "completed"){
        if(unsubscribeListener){ unsubscribeListener(); unsubscribeListener = null; }
        showSuccessScreen(amount, data);
      }
      // status === rejected / failed → error
      else if(data.status === "rejected" || data.status === "failed"){
        if(unsubscribeListener){ unsubscribeListener(); unsubscribeListener = null; }
        showFailedScreen();
      }
      // else: still pending → keep waiting
    }, (err) => {
      console.error("Listener error:", err);
    });
}

/* =========================================================
   SUCCESS SCREEN
   ========================================================= */
function showSuccessScreen(amount, data){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="success-screen">
      <div class="success-icon">✓</div>
      <h2>Payment Successful</h2>
      <p>Your payment has been confirmed. Thank you!</p>

      <div class="success-box">
        <div class="row"><span class="lbl">Order ID</span><span class="val">${escapeHtml(orderId)}</span></div>
        <div class="row"><span class="lbl">Amount</span><span class="val" style="color:#10b981;">₹${formatAmount(amount)}</span></div>
        <div class="row"><span class="lbl">Status</span><span class="val" style="color:#10b981;">✓ Success</span></div>
      </div>

      <button class="success-btn" onclick="window.close()">Close</button>
    </div>
  `;
  window.scrollTo(0,0);
}

/* =========================================================
   FAILED SCREEN
   ========================================================= */
function showFailedScreen(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="error-screen">
      <div class="error-icon">✕</div>
      <h2>Payment Failed</h2>
      <p>Your payment could not be verified. Please contact the merchant or try again.</p>
      <button class="success-btn" style="margin-top:24px;" onclick="location.reload()">Try Again</button>
    </div>
  `;
  window.scrollTo(0,0);
}

/* =========================================================
   HELPERS
   ========================================================= */
function errorScreen(title, msg){
  return `
    <div class="error-screen">
      <div class="error-icon">✕</div>
      <h2>${title}</h2>
      <p>${msg}</p>
    </div>
  `;
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
