<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>PayVora — Secure Checkout</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070b1e;--bg-2:#0d1233;--card:#121a3d;--card-2:#1a2352;
  --border:rgba(99,102,241,.22);--border-2:rgba(99,102,241,.4);
  --purple:#6366f1;--purple-2:#8b5cf6;--blue:#3b82f6;
  --green:#10b981;--orange:#f59e0b;--red:#ef4444;
  --text:#fff;--text-2:#cbd5e1;--muted:#64748b;--muted-2:#94a3b8;
}
html,body{overflow-x:hidden}
body{
  background:radial-gradient(circle at 0% 0%, #1a1247 0%, transparent 50%),
             radial-gradient(circle at 100% 100%, #1e1b4b 0%, transparent 50%),
             #070b1e;
  color:var(--text);-webkit-font-smoothing:antialiased;
  min-height:100vh;padding:24px 16px 0;position:relative;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::selection{background:var(--purple);color:#fff}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}

.page-wrap{max-width:1240px;margin:0 auto;position:relative;z-index:1}

/* HEADER */
.brand-header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 28px;flex-wrap:wrap;gap:16px;animation:fadeUp .6s ease}
.brand-left{display:flex;align-items:center;gap:14px}
.brand-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;box-shadow:0 12px 32px rgba(99,102,241,.5)}
.brand-name{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1}
.brand-name .tm{font-size:11px;vertical-align:super;color:var(--muted-2);font-weight:600;margin-left:2px}
.brand-tagline{font-size:12px;color:var(--muted-2);margin-top:5px;letter-spacing:2px;font-weight:500;text-transform:uppercase}
.brand-tagline span{color:var(--purple-2);margin:0 4px}
.brand-right{text-align:right}
.brand-right .title{font-size:15px;font-weight:700}
.brand-right .title-2{font-size:15px;font-weight:700;background:linear-gradient(90deg,#8b5cf6,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-right .line{width:60px;height:2px;background:linear-gradient(90deg,var(--purple),transparent);margin-left:auto;margin-top:8px}

/* GRID */
.main-grid{display:grid;grid-template-columns:420px 1fr;gap:24px;animation:fadeUp .7s ease .1s both}

.panel{background:linear-gradient(155deg,rgba(18,26,61,.95),rgba(10,14,39,.95));border:1px solid var(--border);border-radius:20px;padding:26px;position:relative;overflow:hidden}

/* LEFT */
.order-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.order-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(139,92,246,.25));border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 24px rgba(99,102,241,.2)}
.order-head-text h3{font-size:17px;font-weight:800;letter-spacing:-.3px}
.order-head-text p{font-size:12px;color:var(--muted-2);margin-top:3px}
.order-info-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(99,102,241,.1)}
.order-info-row .label{font-size:12px;color:var(--muted-2);font-weight:600}
.order-info-row .value{font-size:14px;font-weight:700;color:var(--text);text-align:right;font-family:ui-monospace,monospace}
.order-info-row .value.big{font-size:26px;font-weight:900;letter-spacing:-1px;font-family:'Inter';background:linear-gradient(90deg,#fff,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.features-title{font-size:13px;font-weight:700;margin-top:22px;margin-bottom:4px}
.features-sub{font-size:11.5px;color:var(--muted-2);margin-bottom:18px}
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.feature-item{text-align:center;padding:14px 8px;border-radius:12px;background:rgba(99,102,241,.05);border:1px solid rgba(99,102,241,.1);transition:all .25s}
.feature-item:hover{background:rgba(99,102,241,.1);border-color:var(--border-2);transform:translateY(-2px)}
.feature-icon{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,rgba(99,102,241,.3),rgba(139,92,246,.3));border:1px solid rgba(99,102,241,.35);display:flex;align-items:center;justify-content:center;font-size:18px;margin:0 auto 8px;color:#a5b4fc}
.feature-item .name{font-size:11px;font-weight:700;color:var(--text-2);line-height:1.3}
.brand-banner{margin-top:24px;padding:20px;border-radius:16px;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.08));border:1px solid var(--border);display:flex;align-items:center;gap:14px}
.brand-banner-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.4);flex-shrink:0}
.brand-banner-text .name{font-size:18px;font-weight:900;letter-spacing:-.3px}
.brand-banner-text .tagline{font-size:11px;color:var(--muted-2);margin-top:3px;font-weight:500}

/* RIGHT */
.payment-header h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.payment-header p{font-size:12.5px;color:var(--muted-2);margin-bottom:20px}

.method-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.method-tab{padding:14px 8px;border-radius:14px;background:rgba(99,102,241,.04);border:1.5px solid rgba(99,102,241,.15);cursor:pointer;transition:all .25s;text-align:center}
.method-tab:hover{border-color:var(--border-2);background:rgba(99,102,241,.08)}
.method-tab.active{background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(139,92,246,.15));border-color:var(--purple);box-shadow:0 10px 30px rgba(99,102,241,.3)}
.method-tab .icon{font-size:20px;margin-bottom:6px;display:block;opacity:.85}
.method-tab.active .icon{opacity:1}
.method-tab .name{font-size:12px;font-weight:700;color:var(--text-2);line-height:1.25}
.method-tab.active .name{color:#fff}
.method-tab .sub{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.25}
.method-tab.active .sub{color:#c7d2fe}

/* METHOD CONTENT (tabs) */
.method-content{display:none;animation:fadeUp .35s ease}
.method-content.active{display:block}

/* Amount input */
.input-row{margin-bottom:16px}
.input-row label{display:block;font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:8px;letter-spacing:.3px}
.input-wrap{position:relative}
.input-wrap .prefix{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:800;color:var(--muted-2);pointer-events:none}
.input-wrap input{width:100%;padding:14px 16px 14px 42px;background:rgba(7,11,30,.7);border:1.5px solid rgba(99,102,241,.25);border-radius:12px;color:#fff;font-size:16px;font-weight:700;outline:none;transition:all .25s;font-family:inherit}
.input-wrap input.no-prefix{padding-left:16px}
.input-wrap input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(99,102,241,.15);background:rgba(7,11,30,.9)}
.input-wrap input::placeholder{color:#475569;font-weight:500}
.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;margin-bottom:18px}
.quick-amounts button{padding:8px 14px;border-radius:99px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);color:#c7d2fe;font-size:12px;font-weight:700;transition:all .2s}
.quick-amounts button:hover{border-color:var(--purple);background:rgba(99,102,241,.15);color:#fff;transform:translateY(-1px)}

/* QR holder — FIXED SIZE */
.qr-holder-box{
  background:#fff;
  padding:16px;
  border-radius:18px;
  width:fit-content;
  margin:0 auto 18px;
  box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 0 1px rgba(99,102,241,.3);
  position:relative;
}
.qr-inner{
  width:220px;
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.qr-inner img,.qr-inner canvas{
  display:block !important;
  width:220px !important;
  height:220px !important;
  border-radius:4px;
}
.qr-center-logo{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:46px;height:46px;
  border-radius:11px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  border:3px solid #fff;
  z-index:2;
}
.qr-empty{
  width:220px;height:220px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px;
  color:#64748b;font-size:12px;line-height:1.5;
  font-weight:600;
}

.upi-id-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);border-radius:12px;font-size:12.5px;margin-bottom:16px}
.upi-id-row .lbl{color:var(--muted-2);font-weight:600}
.upi-id-row .val{font-family:ui-monospace,monospace;font-weight:700;color:#a5b4fc;cursor:pointer;display:flex;align-items:center;gap:6px}
.upi-id-row .val:hover{color:#fff}

/* QR Apps grid */
.apps-side h5{font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:12px;text-align:center}
.apps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.app-chip{padding:14px 6px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(99,102,241,.12);text-align:center;transition:all .2s}
.app-chip:hover{transform:translateY(-2px);border-color:var(--border-2);background:rgba(99,102,241,.1)}
.app-chip .logo{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:900;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.app-chip .name{font-size:10.5px;font-weight:700;color:var(--text-2);line-height:1.2}
.apps-more{text-align:center;font-size:11px;color:var(--muted);font-style:italic;margin-bottom:16px}

/* UTR + Submit */
.utr-box{margin-top:16px}
.btn-submit{width:100%;padding:16px;border-radius:14px;font-weight:800;font-size:15px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;cursor:pointer;transition:all .3s;margin-top:16px;box-shadow:0 12px 32px rgba(99,102,241,.4)}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(99,102,241,.5)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}

/* Redirect Section */
.redirect-head{text-align:center;margin-bottom:20px}
.redirect-head h4{font-size:16px;font-weight:800;margin-bottom:6px}
.redirect-head p{font-size:12.5px;color:var(--muted-2)}
.redirect-apps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.redirect-btn{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;border-radius:14px;
  background:rgba(99,102,241,.06);
  border:1.5px solid rgba(99,102,241,.2);
  cursor:pointer;transition:all .25s;
  text-align:left;font-family:inherit;
}
.redirect-btn:hover{background:rgba(99,102,241,.15);border-color:var(--purple);transform:translateY(-2px);box-shadow:0 10px 24px rgba(99,102,241,.2)}
.redirect-btn .rb-icon{
  width:44px;height:44px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;flex-shrink:0;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.redirect-btn .rb-text{flex:1}
.redirect-btn .rb-name{font-size:13.5px;font-weight:800;color:#fff}
.redirect-btn .rb-sub{font-size:11px;color:var(--muted-2);margin-top:2px}

/* Security */
.security-notice{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(5,150,105,.05));border:1px solid rgba(16,185,129,.25);margin-top:20px}
.security-notice .shield{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(16,185,129,.35)}
.security-notice .text-1{font-size:13px;font-weight:700;color:#6ee7b7}
.security-notice .text-2{font-size:11px;color:#94a3b8;margin-top:3px}

/* FOOTER */
.footer-badges{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;margin-top:24px;flex-wrap:wrap;border-top:1px solid rgba(99,102,241,.1);animation:fadeUp .7s ease .3s both}
.fbadge{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted-2);font-weight:600}
.fbadge .fb-icon{width:36px;height:36px;border-radius:9px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);display:flex;align-items:center;justify-content:center;font-size:16px}
.fbadge .fb-name{color:var(--text);font-weight:700;font-size:12px}
.fbadge .fb-sub{font-size:10px;color:var(--muted);font-weight:500}

/* SUCCESS */
.success-wrap{padding:60px 40px;text-align:center;grid-column:1/-1;animation:scaleIn .55s}
.success-icon{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:50px;color:#fff;margin:0 auto 26px;box-shadow:0 20px 60px rgba(16,185,129,.5)}
.success-wrap h2{font-size:30px;font-weight:800;margin-bottom:12px;letter-spacing:-.6px}
.success-wrap p{color:var(--muted-2);font-size:14px;line-height:1.65;max-width:440px;margin:0 auto 26px}
.order-box{background:rgba(18,26,61,.7);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:460px;margin:0 auto 26px;text-align:left}
.order-box .row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:13px;border-bottom:1px solid rgba(99,102,241,.1)}
.order-box .row:last-child{border:none}
.order-box .lbl{color:var(--muted-2);font-weight:500}
.order-box .val{font-weight:700;color:var(--text);text-align:right;word-break:break-all}
.btn-close{padding:15px 36px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:13px;font-weight:700;font-size:14px;transition:all .25s;box-shadow:0 10px 28px rgba(99,102,241,.4)}
.btn-close:hover{transform:translateY(-2px)}

/* ERROR */
.error-wrap{padding:60px 40px;text-align:center;grid-column:1/-1}
.error-icon{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(220,38,38,.15));border:1px solid rgba(239,68,68,.3);display:flex;align-items:center;justify-content:center;font-size:50px;color:#f87171;margin:0 auto 26px}
.error-wrap h2{font-size:26px;font-weight:800;margin-bottom:12px}
.error-wrap p{color:var(--muted-2);font-size:14px;line-height:1.65;max-width:440px;margin:0 auto}

/* LOADING */
.loading-wrap{padding:80px 40px;text-align:center;grid-column:1/-1}
.loading-spinner{width:56px;height:56px;border:3px solid rgba(99,102,241,.15);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 22px}

/* TOAST */
.toast{position:fixed;top:24px;right:24px;left:24px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:15px 22px;border-radius:13px;font-size:13px;font-weight:600;z-index:9999;transform:translateY(-200%);transition:transform .4s cubic-bezier(.4,0,.2,1);box-shadow:0 20px 60px rgba(99,102,241,.5);text-align:center;max-width:440px;margin:0 auto}
.toast.show{transform:translateY(0)}
.toast.success{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 20px 60px rgba(16,185,129,.5)}
.toast.error{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 20px 60px rgba(239,68,68,.5)}

@media(max-width:1000px){.main-grid{grid-template-columns:1fr}}
@media(max-width:768px){
  body{padding:16px 12px 0}
  .brand-header{flex-direction:column;align-items:flex-start;gap:12px;padding:8px 0 20px}
  .brand-right{text-align:left}
  .brand-right .line{margin-left:0}
  .brand-logo{width:46px;height:46px;font-size:22px}
  .brand-name{font-size:22px}
  .brand-tagline{font-size:10.5px;letter-spacing:1.5px}
  .panel{padding:20px;border-radius:16px}
  .order-info-row .value.big{font-size:22px}
  .method-tabs{gap:8px}
  .method-tab{padding:12px 6px;border-radius:11px}
  .method-tab .icon{font-size:18px}
  .method-tab .name{font-size:11px}
  .method-tab .sub{font-size:9px}
  .qr-inner{width:190px;height:190px}
  .qr-inner img,.qr-inner canvas{width:190px !important;height:190px !important}
  .qr-empty{width:190px;height:190px}
  .qr-center-logo{width:42px;height:42px;font-size:20px}
  .apps-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .app-chip{padding:12px 4px}
  .app-chip .logo{width:34px;height:34px;font-size:14px}
  .app-chip .name{font-size:9.5px}
  .redirect-apps{grid-template-columns:1fr}
  .redirect-btn{padding:14px 16px}
  .footer-badges{justify-content:center;gap:14px;padding:18px 0}
  .fbadge{font-size:10.5px}
  .fbadge .fb-icon{width:30px;height:30px;font-size:14px}
  .success-wrap{padding:40px 22px}
  .success-icon{width:80px;height:80px;font-size:40px}
  .success-wrap h2{font-size:22px}
  .order-box{padding:18px}
}
@media(max-width:400px){
  .qr-inner{width:170px;height:170px}
  .qr-inner img,.qr-inner canvas{width:170px !important;height:170px !important}
  .qr-empty{width:170px;height:170px}
  .brand-name{font-size:20px}
}
</style>
</head>
<body>

<div class="page-wrap">

  <!-- HEADER -->
  <div class="brand-header">
    <div class="brand-left">
      <div class="brand-logo">P</div>
      <div>
        <div class="brand-name">Payvora<span class="tm">™</span></div>
        <div class="brand-tagline">Secure <span>•</span> Fast <span>•</span> Reliable</div>
      </div>
    </div>
    <div class="brand-right">
      <div class="title">Powering Digital Payments</div>
      <div class="title-2">for a Smarter Tomorrow</div>
      <div class="line"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-grid" id="app">
    <div class="loading-wrap">
      <div class="loading-spinner"></div>
      <p style="color:var(--muted-2);font-size:14px;">Loading secure checkout...</p>
    </div>
  </div>

  <!-- FOOTER BADGES -->
  <div class="footer-badges">
    <div class="fbadge"><div class="fb-icon">💳</div><div><div class="fb-name">UPI Enabled</div><div class="fb-sub">Instant Bank Transfer</div></div></div>
    <div class="fbadge"><div class="fb-icon">🏦</div><div><div class="fb-name">RuPay Cards</div><div class="fb-sub">Accepted</div></div></div>
    <div class="fbadge"><div class="fb-icon">🔒</div><div><div class="fb-name">256-bit SSL</div><div class="fb-sub">Encryption</div></div></div>
    <div class="fbadge"><div class="fb-icon">✅</div><div><div class="fb-name">PCI DSS</div><div class="fb-sub">Compliant</div></div></div>

function formatAmount(n){
  return Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function switchTab(tab, el){
  activeTab = tab;
  document.querySelectorAll(".method-tab").forEach(t=>t.classList.remove("active"));
  if(el) el.classList.add("active");
  document.querySelectorAll(".method-content").forEach(c=>c.classList.remove("active"));
  const content = document.getElementById("content-" + tab);
  if(content) content.classList.add("active");
}

/* ========== STATIC QR ========== */
function renderStaticQr(){
  const inner = document.getElementById("staticQrInner");
  if(!inner) return;
  const empty = inner.querySelector(".qr-empty");
  if(empty) empty.remove();

  // Static QR = simple UPI link without amount (customer enters)
  const pa = SETTINGS.upiId;
  const pn = encodeURIComponent(SETTINGS.payeeName || "Merchant");
  const cu = "INR";
  const tn = encodeURIComponent("Payment");
  const upiLink = `upi://pay?pa=${pa}&pn=${pn}&cu=${cu}&tn=${tn}`;

  const qrDiv = document.createElement("div");
  qrDiv.style.position = "relative";
  qrDiv.style.zIndex = "1";
  inner.insertBefore(qrDiv, inner.firstChild);

  if(typeof QRCode === "undefined"){
    qrDiv.innerHTML = '<p style="color:#64748b;font-size:11px;padding:20px">QR library not loaded</p>';
    return;
  }

  try{
    new QRCode(qrDiv, {
      text: upiLink,
      width: 220,
      height: 220,
      colorDark: "#0a0a0a",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
    setTimeout(()=>{
      const img = qrDiv.querySelector("img");
      const canvas = qrDiv.querySelector("canvas");
      const target = img || canvas;
      if(target){
        target.style.width = "220px";
        target.style.height = "220px";
        target.style.display = "block";
        target.style.borderRadius = "4px";
      }
    }, 60);
  }catch(e){
    console.error(e);
    qrDiv.innerHTML = '<p style="color:#64748b;font-size:11px;padding:20px">QR failed</p>';
  }
}

/* ========== DYNAMIC QR ========== */
function onDynamicAmountChange(){
  const val = parseFloat(document.getElementById("dynamicAmount").value) || 0;
  currentAmount = val;
  const big = document.getElementById("bigAmount");
  if(big) big.textContent = "₹" + formatAmount(val);
  renderDynamicQr(val);
}

function setDynamicAmount(v){
  const inp = document.getElementById("dynamicAmount");
  if(!inp) return;
  inp.value = v;
  onDynamicAmountChange();
  inp.focus();
}

function renderDynamicQr(amount){
  const inner = document.getElementById("dynamicQrInner");
  if(!inner) return;

  // Remove old QR
  const oldQr = inner.querySelector("div:not(.qr-empty):not(.qr-center-logo)");
  if(oldQr) oldQr.remove();

  const empty = inner.querySelector(".qr-empty");

  if(!amount || amount <= 0){
    if(!empty){
      const ph = document.createElement("div");
      ph.className = "qr-empty";
      ph.textContent = "Enter amount above to generate your QR code.";
      inner.insertBefore(ph, inner.querySelector(".qr-center-logo"));
    } else {
      empty.textContent = "Enter amount above to generate your QR code.";
      empty.style.display = "flex";
    }
    return;
  }

  if(empty) empty.remove();

  const pa = SETTINGS.upiId;
  const pn = encodeURIComponent(SETTINGS.payeeName || "Merchant");
  const am = Number(amount).toFixed(2);
  const cu = "INR";
  const tn = encodeURIComponent("Payment for " + orderId);
  const upiLink = `upi://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=${cu}`;

  const qrDiv = document.createElement("div");
  qrDiv.style.position = "relative";
  qrDiv.style.zIndex = "1";
  inner.insertBefore(qrDiv, inner.firstChild);

  if(typeof QRCode === "undefined"){
    qrDiv.innerHTML = '<p style="color:#64748b;font-size:11px;padding:20px">QR library not loaded</p>';
    return;
  }

  try{
    new QRCode(qrDiv, {
      text: upiLink,
      width: 220,
      height: 220,
      colorDark: "#0a0a0a",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
    setTimeout(()=>{
      const img = qrDiv.querySelector("img");
      const canvas = qrDiv.querySelector("canvas");
      const target = img || canvas;
      if(target){
        target.style.width = "220px";
        target.style.height = "220px";
        target.style.display = "block";
        target.style.borderRadius = "4px";
      }
    }, 60);
    console.log("Dynamic QR generated for ₹" + amount);
  }catch(e){
    console.error(e);
    qrDiv.innerHTML = '<p style="color:#64748b;font-size:11px;padding:20px">QR failed</p>';
  }
}

/* ========== REDIRECT ========== */
function onRedirectAmountChange(){

function openIntent(app, event){
  if(event) event.preventDefault();
  const amount = parseFloat(document.getElementById("redirectAmount").value) || 0;
  if(!amount || amount <= 0){
    showToast("Please enter amount first","error");
    return;
  }

  const pa = SETTINGS.upiId;
  const pn = encodeURIComponent(SETTINGS.payeeName || "Merchant");
  const am = amount.toFixed(2);
  const tr = orderId;
  const tn = encodeURIComponent("Payment for " + orderId);
  const cu = "INR";

  let upiLink;
  if(app === "gpay"){
    upiLink = `tez://upi/pay?pa=${pa}&pn=${pn}&am=${am}&tr=${tr}&tn=${tn}&cu=${cu}`;
  } else if(app === "phonepe"){
    upiLink = `phonepe://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${tr}&tn=${tn}&cu=${cu}`;
  } else if(app === "paytm"){
    upiLink = `paytmmp://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${tr}&tn=${tn}&cu=${cu}`;
  } else {
    upiLink = `upi://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${tr}&tn=${tn}&cu=${cu}`;
  }

  try{ window.location.href = upiLink; }
  catch(e){ window.location.href = `upi://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${tr}&tn=${tn}&cu=${cu}`; }

  setTimeout(() => {
    showToast("After paying, enter the UTR below","success");
    const utrEl = document.getElementById("utrRedirect");
    if(utrEl){ utrEl.scrollIntoView({behavior:"smooth",block:"center"}); utrEl.focus(); }
  }, 2500);
}

/* ========== SUBMIT ========== */
async function submitPayment(utrInputId){
  const utr = document.getElementById(utrInputId).value.trim();
  let amount = currentAmount;

  // Dynamic & Redirect tabs have their own amount inputs
  if(activeTab === "dynamic"){
    amount = parseFloat(document.getElementById("dynamicAmount").value) || 0;
  } else if(activeTab === "redirect"){
    amount = parseFloat(document.getElementById("redirectAmount").value) || 0;
  }
  // Static tab: amount is optional (customer decides in UPI app)

  const btn = event?.target || document.querySelector(".btn-submit:not([disabled])");

  if(!utr || utr.length < 6){
    showToast("Please enter valid UTR (min 6 chars)","error");
    return;
  }

  if((activeTab === "dynamic" || activeTab === "redirect") && (!amount || amount <= 0)){
    showToast("Please enter amount first","error");
    return;
  }

  if(btn){
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Submitting...';
  }

  try{
    const depositId = await DB.push("deposits", {
      email: merchant,
      merchant: merchant,
      amount: amount || 0,
      utr: utr,
      orderId: orderId,
      source: "checkout",
      method: activeTab,
      status: "pending",
      at: new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})
    });
    if(!depositId) throw new Error("Could not save payment");
    showSuccess(utr, amount || 0);
  }catch(e){
    console.error(e);
    if(btn){
      btn.disabled = false;
      btn.innerHTML = '✅ I\'ve Paid — Submit';
    }
    showToast("Error: " + e.message, "error");
  }
}

function showSuccess(utr, amount){
  const app = document.getElementById("app");
  app.style.gridTemplateColumns = "1fr";
  app.innerHTML = `
    <div class="success-wrap">
      <div class="success-icon">✓</div>
      <h2>Payment Submitted!</h2>
      <p>Your payment details have been received. The merchant will verify and confirm shortly.</p>

      <div class="order-box">
        <div class="row"><span class="lbl">Order ID</span><span class="val">${escapeHtml(orderId)}</span></div>
        <div class="row"><span class="lbl">Amount</span><span class="val" style="color:#6ee7b7;">${amount ? '₹'+formatAmount(amount) : 'As per payment'}</span></div>
        <div class="row"><span class="lbl">UTR</span><span class="val" style="font-family:ui-monospace,monospace;font-size:12px;">${escapeHtml(utr)}</span></div>
        <div class="row"><span class="lbl">Status</span><span class="val" style="color:#fbbf24;">⏳ Pending Verification</span></div>
      </div>

      <p style="font-size:12px;color:var(--muted);max-width:440px;margin:0 auto 24px;">
        Please take a screenshot of this page for your records.
      </p>

      <button class="btn-close" onclick="window.close()">Close Window</button>
    </div>
  `;
  window.scrollTo(0,0);
}

function errorPage(title, msg){
  return `<div class="error-wrap"><div class="error-icon">✕</div><h2>${title}</h2><p>${msg}</p></div>`;
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function copyText(text, el){
  navigator.clipboard.writeText(text).then(()=>{
    const orig = el.innerHTML;
    el.innerHTML = "✅ Copied!";
    setTimeout(()=>el.innerHTML = orig, 1500);
    showToast("Copied: " + text, "success");
  }).catch(()=>{ showToast("UPI ID: " + text); });
}

function showToast(m, t=""){
  const el = document.getElementById("toast");
  el.textContent = m;
  el.className = "toast show " + t;
  setTimeout(()=>el.className = "toast " + t, 3000);
}
