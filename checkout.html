<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>PayVora — Secure Checkout</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070b1e;
  --bg-2:#0d1233;
  --card:#121a3d;
  --card-2:#1a2352;
  --border:rgba(99,102,241,.22);
  --border-2:rgba(99,102,241,.4);
  --purple:#6366f1;
  --purple-2:#8b5cf6;
  --blue:#3b82f6;
  --green:#10b981;
  --orange:#f59e0b;
  --red:#ef4444;
  --text:#ffffff;
  --text-2:#cbd5e1;
  --muted:#64748b;
  --muted-2:#94a3b8;
}
html,body{overflow-x:hidden}
body{
  background:radial-gradient(circle at 0% 0%, #1a1247 0%, transparent 50%),
             radial-gradient(circle at 100% 100%, #1e1b4b 0%, transparent 50%),
             #070b1e;
  color:var(--text);-webkit-font-smoothing:antialiased;
  min-height:100vh;padding:24px 16px 0;position:relative;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::selection{background:var(--purple);color:#fff}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
@keyframes qrPulse{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.5)}50%{box-shadow:0 0 0 14px rgba(99,102,241,0)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}

/* ============ WRAPPER ============ */
.page-wrap{max-width:1240px;margin:0 auto;position:relative;z-index:1}

/* ============ HEADER ============ */
.brand-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 0 28px;flex-wrap:wrap;gap:16px;
  animation:fadeUp .6s ease;
}
.brand-left{display:flex;align-items:center;gap:14px}
.brand-logo{
  width:56px;height:56px;border-radius:14px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#fff;
  box-shadow:0 12px 32px rgba(99,102,241,.5);
  position:relative;overflow:hidden;
}
.brand-logo::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,.2),transparent);
  transform:translateX(-100%);animation:shimmer 3s infinite;
}
.brand-name{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1}
.brand-name .tm{font-size:11px;vertical-align:super;color:var(--muted-2);font-weight:600;margin-left:2px}
.brand-tagline{font-size:12px;color:var(--muted-2);margin-top:5px;letter-spacing:2px;font-weight:500;text-transform:uppercase}
.brand-tagline span{color:var(--purple-2);margin:0 4px}

.brand-right{text-align:right}
.brand-right .title{font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.brand-right .title-2{font-size:15px;font-weight:700;background:linear-gradient(90deg,#8b5cf6,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-right .line{width:60px;height:2px;background:linear-gradient(90deg,var(--purple),transparent);margin-left:auto;margin-top:8px}

/* ============ MAIN GRID ============ */
.main-grid{
  display:grid;grid-template-columns:420px 1fr;gap:24px;
  animation:fadeUp .7s ease .1s both;
}

/* ============ PANELS ============ */
.panel{
  background:linear-gradient(155deg,rgba(18,26,61,.95),rgba(10,14,39,.95));
  border:1px solid var(--border);
  border-radius:20px;padding:26px;
  backdrop-filter:blur(10px);
  position:relative;overflow:hidden;
}
.panel::before{
  content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(99,102,241,.6),transparent);
  opacity:0;transition:opacity .3s;
}
.panel:hover::before{opacity:1}

/* ============ ORDER SUMMARY (LEFT) ============ */
.order-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.order-icon{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(139,92,246,.25));
  border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  box-shadow:0 8px 24px rgba(99,102,241,.2);
}
.order-head-text h3{font-size:17px;font-weight:800;letter-spacing:-.3px}
.order-head-text p{font-size:12px;color:var(--muted-2);margin-top:3px}

.order-info-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 0;border-bottom:1px solid rgba(99,102,241,.1);
}
.order-info-row .label{font-size:12px;color:var(--muted-2);font-weight:600;letter-spacing:.3px}
.order-info-row .value{font-size:14px;font-weight:700;color:var(--text);text-align:right;font-family:ui-monospace,monospace}
.order-info-row .value.big{font-size:26px;font-weight:900;letter-spacing:-1px;font-family:'Inter';background:linear-gradient(90deg,#fff,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Features */
.features-title{font-size:13px;font-weight:700;color:var(--text);margin-top:22px;margin-bottom:4px}
.features-sub{font-size:11.5px;color:var(--muted-2);margin-bottom:18px}

.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.feature-item{text-align:center;padding:14px 8px;border-radius:12px;background:rgba(99,102,241,.05);border:1px solid rgba(99,102,241,.1);transition:all .25s}
.feature-item:hover{background:rgba(99,102,241,.1);border-color:var(--border-2);transform:translateY(-2px)}
.feature-icon{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,rgba(99,102,241,.3),rgba(139,92,246,.3));
  border:1px solid rgba(99,102,241,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;margin:0 auto 8px;
  color:#a5b4fc;
}
.feature-item .name{font-size:11px;font-weight:700;color:var(--text-2);line-height:1.3}

/* Brand banner at bottom */
.brand-banner{
  margin-top:24px;padding:20px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.08));
  border:1px solid var(--border);
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:14px;
}
.brand-banner::before{
  content:'';position:absolute;bottom:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.4),transparent 70%);
  animation:glow 3s ease-in-out infinite;
}
.brand-banner-logo{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:#fff;
  box-shadow:0 8px 20px rgba(99,102,241,.4);
  flex-shrink:0;position:relative;z-index:1;
}
.brand-banner-text{position:relative;z-index:1}
.brand-banner-text .name{font-size:18px;font-weight:900;letter-spacing:-.3px}
.brand-banner-text .tagline{font-size:11px;color:var(--muted-2);margin-top:3px;font-weight:500}

/* ============ PAYMENT PANEL (RIGHT) ============ */
.payment-header h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.payment-header p{font-size:12.5px;color:var(--muted-2);margin-bottom:20px}

/* Method tabs */
.method-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.method-tab{
  padding:16px 12px;border-radius:14px;
  background:rgba(99,102,241,.04);
  border:1.5px solid rgba(99,102,241,.15);
  cursor:pointer;transition:all .25s;
  text-align:center;position:relative;
}
.method-tab:hover{border-color:var(--border-2);background:rgba(99,102,241,.08)}
.method-tab.active{
  background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(139,92,246,.15));
  border-color:var(--purple);
  box-shadow:0 10px 30px rgba(99,102,241,.3),inset 0 0 20px rgba(99,102,241,.1);
}
.method-tab .icon{font-size:22px;margin-bottom:8px;display:block;opacity:.9}
.method-tab.active .icon{opacity:1}
.method-tab .name{font-size:12.5px;font-weight:700;color:var(--text-2);line-height:1.3}
.method-tab.active .name{color:#fff}
.method-tab .sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3}
.method-tab.active .sub{color:#c7d2fe}

/* QR Section */
.qr-block{
  background:rgba(7,11,30,.6);
  border:1px solid var(--border);
  border-radius:18px;padding:22px;margin-bottom:18px;
  animation:fadeUp .4s ease;
}
.qr-block-head{margin-bottom:18px}
.qr-block-head h4{font-size:15px;font-weight:700;margin-bottom:4px}
.qr-block-head p{font-size:11.5px;color:var(--muted-2)}

.qr-flex{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:flex-start}

.qr-holder{
  background:#fff;padding:14px;border-radius:16px;
  box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 0 1px rgba(99,102,241,.3);
  position:relative;
}
.qr-holder img,.qr-holder canvas{display:block;width:200px;height:200px;border-radius:8px}
.qr-holder .center-logo{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:10px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  border:3px solid #fff;
}
.qr-placeholder{
  width:200px;height:200px;border-radius:10px;
  background:linear-gradient(135deg,#f8fafc,#eff6ff);
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:14px;color:#64748b;font-size:12px;
}

.upi-id-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:14px;padding:10px 14px;
  background:rgba(99,102,241,.08);
  border:1px solid rgba(99,102,241,.2);
  border-radius:10px;
  font-size:12.5px;
}
.upi-id-row .lbl{color:var(--muted-2);font-weight:600}
.upi-id-row .val{font-family:ui-monospace,monospace;font-weight:700;color:#a5b4fc;cursor:pointer;display:flex;align-items:center;gap:6px}
.upi-id-row .val:hover{color:#fff}

/* Right side of QR: App icons */
.apps-side h5{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:12px;letter-spacing:.2px}
.apps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.app-chip{
  padding:12px 6px;border-radius:11px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(99,102,241,.12);
  text-align:center;transition:all .2s;cursor:pointer;
}
.app-chip:hover{transform:translateY(-2px);border-color:var(--border-2);background:rgba(99,102,241,.1)}
.app-chip .logo{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 7px;font-weight:900;font-size:14px;
  box-shadow:0 3px 8px rgba(0,0,0,.2);
}
.app-chip .name{font-size:10px;font-weight:700;color:var(--text-2);line-height:1.2}
.apps-more{text-align:center;margin-top:12px;font-size:11px;color:var(--muted);font-style:italic}

/* Option rows (Dynamic QR / Redirect) */
.option-row{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;border-radius:14px;
  background:rgba(99,102,241,.04);
  border:1px solid rgba(99,102,241,.15);
  margin-bottom:12px;cursor:pointer;
  transition:all .25s;position:relative;
}
.option-row:hover{background:rgba(99,102,241,.1);border-color:var(--border-2);transform:translateX(4px)}
.option-row .opt-icon{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(139,92,246,.2));
  border:1px solid rgba(99,102,241,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#a5b4fc;flex-shrink:0;
}
.option-row .opt-text{flex:1}
.option-row .opt-title{font-size:13.5px;font-weight:700;color:var(--text)}
.option-row .opt-desc{font-size:11.5px;color:var(--muted-2);margin-top:2px}
.option-row .arrow{font-size:16px;color:var(--muted-2)}

/* Security notice */
.security-notice{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;border-radius:14px;
  background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(5,150,105,.05));
  border:1px solid rgba(16,185,129,.25);
  margin-top:16px;
}
.security-notice .shield{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(135deg,#10b981,#059669);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;flex-shrink:0;
  box-shadow:0 6px 16px rgba(16,185,129,.35);
}
.security-notice .text-1{font-size:13px;font-weight:700;color:#6ee7b7}
.security-notice .text-2{font-size:11px;color:#94a3b8;margin-top:3px}

/* Amount + UTR inputs (in QR section) */
.input-row{margin-top:18px}
.input-row label{display:block;font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:8px;letter-spacing:.3px}
.input-wrap{position:relative}
.input-wrap .prefix{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:18px;font-weight:800;color:var(--muted-2);pointer-events:none;
}
.input-wrap input{
  width:100%;padding:14px 16px 14px 40px;
  background:rgba(7,11,30,.7);
  border:1.5px solid rgba(99,102,241,.25);
  border-radius:12px;
  color:#fff;font-size:15px;font-weight:700;
  outline:none;transition:all .25s;
}
.input-wrap input.no-prefix{padding-left:16px}
.input-wrap input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(99,102,241,.15);background:rgba(7,11,30,.9)}
.input-wrap input::placeholder{color:#475569;font-weight:500}

.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quick-amounts button{
  padding:8px 14px;border-radius:99px;
  background:rgba(99,102,241,.08);
  border:1px solid rgba(99,102,241,.2);
  color:#c7d2fe;font-size:12px;font-weight:700;
  transition:all .2s;
}
.quick-amounts button:hover{border-color:var(--purple);background:rgba(99,102,241,.15);color:#fff;transform:translateY(-1px)}

/* Submit button */
.btn-submit{
  width:100%;padding:17px;border-radius:14px;
  font-weight:800;font-size:15px;letter-spacing:.3px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;cursor:pointer;transition:all .3s;
  margin-top:18px;
  box-shadow:0 12px 32px rgba(99,102,241,.4);
  position:relative;overflow:hidden;
}
.btn-submit::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,.2),transparent);
  transform:translateX(-100%);transition:transform .6s;
}
.btn-submit:hover::before{transform:translateX(100%)}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(99,102,241,.5)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}

/* ============ FOOTER BADGES ============ */
.footer-badges{
  display:flex;justify-content:space-between;align-items:center;
  gap:20px;padding:24px 0;margin-top:24px;
  flex-wrap:wrap;
  border-top:1px solid rgba(99,102,241,.1);
  animation:fadeUp .7s ease .3s both;
}
.fbadge{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted-2);font-weight:600}
.fbadge .fb-icon{
  width:36px;height:36px;border-radius:9px;
  background:rgba(99,102,241,.1);
  border:1px solid rgba(99,102,241,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.fbadge .fb-name{color:var(--text);font-weight:700;font-size:12px}
.fbadge .fb-sub{font-size:10px;color:var(--muted);font-weight:500}

/* ============ SUCCESS ============ */
.success-wrap{padding:60px 40px;text-align:center;grid-column:1/-1;animation:scaleIn .55s cubic-bezier(.4,0,.2,1)}
.success-icon{
  width:100px;height:100px;border-radius:50%;
  background:linear-gradient(135deg,#10b981,#059669);
  display:flex;align-items:center;justify-content:center;
  font-size:50px;color:#fff;margin:0 auto 26px;
  box-shadow:0 20px 60px rgba(16,185,129,.5);
  border:4px solid rgba(255,255,255,.1);
}
.success-wrap h2{font-size:30px;font-weight:800;margin-bottom:12px;letter-spacing:-.6px}
.success-wrap p{color:var(--muted-2);font-size:14px;line-height:1.65;max-width:440px;margin:0 auto 26px}
.order-box{
  background:rgba(18,26,61,.7);
  border:1px solid var(--border);
  border-radius:16px;padding:24px;max-width:460px;margin:0 auto 26px;
  text-align:left;
}
.order-box .row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:13px;border-bottom:1px solid rgba(99,102,241,.1)}
.order-box .row:last-child{border:none}
.order-box .lbl{color:var(--muted-2);font-weight:500}
.order-box .val{font-weight:700;color:var(--text);text-align:right;word-break:break-all}
.btn-close{padding:15px 36px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:13px;font-weight:700;font-size:14px;transition:all .25s;box-shadow:0 10px 28px rgba(99,102,241,.4)}
.btn-close:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(99,102,241,.5)}

/* ============ ERROR ============ */
.error-wrap{padding:60px 40px;text-align:center;grid-column:1/-1}
.error-icon{
  width:100px;height:100px;border-radius:50%;
  background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(220,38,38,.15));
  border:1px solid rgba(239,68,68,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:50px;color:#f87171;margin:0 auto 26px;
}
.error-wrap h2{font-size:26px;font-weight:800;margin-bottom:12px}
.error-wrap p{color:var(--muted-2);font-size:14px;line-height:1.65;max-width:440px;margin:0 auto}

/* ============ LOADING ============ */
.loading-wrap{padding:80px 40px;text-align:center;grid-column:1/-1}
.loading-spinner{width:56px;height:56px;border:3px solid rgba(99,102,241,.15);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 22px}

/* ============ TOAST ============ */
.toast{
  position:fixed;top:24px;right:24px;left:24px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;padding:15px 22px;
  border-radius:13px;font-size:13px;font-weight:600;
  z-index:9999;transform:translateY(-200%);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  box-shadow:0 20px 60px rgba(99,102,241,.5);
  text-align:center;max-width:440px;margin:0 auto;
  border:1px solid rgba(255,255,255,.15);
}
.toast.show{transform:translateY(0)}
.toast.success{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 20px 60px rgba(16,185,129,.5)}
.toast.error{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 20px 60px rgba(239,68,68,.5)}

/* ============ RESPONSIVE ============ */
@media(max-width:1000px){
  .main-grid{grid-template-columns:1fr}
  .qr-flex{grid-template-columns:auto 1fr}
}
@media(max-width:768px){
  body{padding:16px 12px 0}
  .brand-header{padding:8px 0 20px;flex-direction:column;align-items:flex-start;gap:12px}
  .brand-right{text-align:left}
  .brand-right .line{margin-left:0}
  .brand-logo{width:46px;height:46px;font-size:22px}
  .brand-name{font-size:22px}

</head>
<body>

  <!-- MAIN -->

    <div class="fbadge">

</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDxrqWXt-GKk-RVHoCA8kPdwYU5VVG-ezg",
  authDomain: "payvora-pg.firebaseapp.com",
  projectId: "payvora-pg",
  storageBucket: "payvora-pg.firebasestorage.app",
  messagingSenderId: "913823472620",
  appId: "1:913823472620:web:46c1389e70a011a77fbec9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const DB = {
  async get(coll, id){
    try{ const d = await db.collection(coll).doc(id).get(); return d.exists ? d.data() : null; }
    catch(e){ console.error(e); return null; }
  },
  async push(coll, data){
    try{ const ref = await db.collection(coll).add(data); return ref.id; }
    catch(e){ console.error(e); return null; }
  }
};

const params = new URLSearchParams(window.location.search);
const merchant = (params.get("merchant") || "").trim().toLowerCase();
const preAmount = parseFloat(params.get("amount") || "0");
const orderId = params.get("order") || params.get("order_id") || ("PV" + new Date().toISOString().slice(0,10).replace(/-/g,"") + "-" + Math.floor(Math.random()*900+100));

let MERCHANT = null;
let SETTINGS = {};
let activeMethod = "static";

(async function init(){
  const app = document.getElementById("app");

  if(!merchant){
    app.innerHTML = errorPage("Invalid Payment Link", "This payment link is invalid. Please request a new link from the merchant.");
    app.style.gridTemplateColumns = "1fr";
    return;
  }

  const m = await DB.get("merchants", merchant);
  if(!m){
    app.innerHTML = errorPage("Merchant Not Found", `Merchant "${merchant}" is not registered on PayVora.`);
    app.style.gridTemplateColumns = "1fr";
    return;
  }
  MERCHANT = m;

  const mySettings = (await DB.get("merchantSettings", merchant)) || {};
  const globalSettings = (await DB.get("paySettings","config")) || {};
  SETTINGS = {
    upiId: mySettings.upiId || globalSettings.upiId || "",
    payeeName: mySettings.payeeName || globalSettings.payeeName || m.name || "Merchant"
  };

  if(!SETTINGS.upiId){
    app.innerHTML = errorPage("Payment Not Configured", "The merchant has not set up UPI payment yet. Please contact the merchant.");
    app.style.gridTemplateColumns = "1fr";
    return;
  }

  renderCheckout();
})();

function renderCheckout(){
  const app = document.getElementById("app");
  const initialAmount = preAmount > 0 ? preAmount : 1000;

  app.innerHTML = `
    <!-- LEFT: ORDER SUMMARY -->
    <div class="panel">
      <div class="order-head">
        <div class="order-icon">🛒</div>
        <div class="order-head-text">
          <h3>Order Summary</h3>
          <p>Complete your payment securely</p>
        </div>
      </div>

      <div class="order-info-row">
        <span class="label">Merchant Name</span>
        <span class="value">${escapeHtml(MERCHANT.name || "Payvora")}</span>
      </div>
      <div class="order-info-row">
        <span class="label">Order ID</span>
        <span class="value">${escapeHtml(orderId)}</span>
      </div>
      <div class="order-info-row">
        <span class="label">Amount</span>
        <span class="value big" id="bigAmount">₹${formatAmount(initialAmount)}</span>
      </div>

      <div class="features-title">Payment Gateway</div>
      <div class="features-sub">Multiple options. One seamless experience.</div>

      <div class="features-grid">
        <div class="feature-item">
          <div class="feature-icon">⚡</div>
          <div class="name">Instant Processing</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">🛡️</div>
          <div class="name">Bank Grade Security</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">🎧</div>
          <div class="name">24/7 Support</div>
        </div>
      </div>

      <div class="brand-banner">
        <div class="brand-banner-logo">P</div>
        <div class="brand-banner-text">
          <div class="name">Payvora</div>
          <div class="tagline">Safe Payments. Better Business.</div>
        </div>
      </div>
    </div>

    <!-- RIGHT: PAYMENT -->
    <div class="panel">
      <div class="payment-header">
        <h2>Choose Payment Method</h2>
        <p>Select your preferred payment option</p>
      </div>

      <div class="method-tabs">
        <div class="method-tab active" data-method="static" onclick="switchMethod('static',this)">
          <span class="icon">▦</span>
          <div class="name">UPI (Static QR)</div>
          <div class="sub">Scan with any app</div>
        </div>
        <div class="method-tab" data-method="dynamic" onclick="switchMethod('dynamic',this)">
          <span class="icon">◫</span>
          <div class="name">UPI (Dynamic QR)</div>
          <div class="sub">New QR per txn</div>
        </div>
        <div class="method-tab" data-method="redirect" onclick="switchMethod('redirect',this)">
          <span class="icon">🔗</span>
          <div class="name">UPI (Redirect)</div>
          <div class="sub">Paytm & Others</div>
        </div>
      </div>

      <div class="qr-block">
        <div class="qr-block-head">
          <h4 id="qrTitle">Scan & Pay via UPI</h4>
          <p id="qrDesc">Use any UPI app to scan the QR code.</p>
        </div>

        <div class="qr-flex">
          <div class="qr-holder" id="qrHolder">
            <div class="qr-placeholder">Enter amount to generate QR</div>
            <div class="center-logo">P</div>
          </div>

          <div class="apps-side">
            <h5>Scan with any UPI app</h5>
            <div class="apps-grid">
              <div class="app-chip">
                <div class="logo" style="background:#fff;color:#4285f4">G</div>
                <div class="name">Google Pay</div>
              </div>
              <div class="app-chip">
                <div class="logo" style="background:#5f259f;color:#fff">पे</div>
                <div class="name">PhonePe</div>
              </div>
              <div class="app-chip">
                <div class="logo" style="background:#fff;color:#00baf2;border:1px solid #e5e7eb">P</div>
                <div class="name">Paytm</div>
              </div>
              <div class="app-chip">
                <div class="logo" style="background:#fff;color:#f59e0b;border:1px solid #e5e7eb">B</div>
                <div class="name">BHIM</div>
              </div>
              <div class="app-chip">
                <div class="logo" style="background:#ff9900;color:#fff">a</div>
                <div class="name">Amazon Pay</div>
              </div>
              <div class="app-chip">
                <div class="logo" style="background:#25d366;color:#fff">W</div>
                <div class="name">WhatsApp Pay</div>
              </div>
            </div>
            <div class="apps-more">... and more UPI apps</div>
          </div>
        </div>

        <div class="upi-id-row">
          <span class="lbl">UPI ID:</span>
          <span class="val" onclick="copyText('${SETTINGS.upiId}',this)">${SETTINGS.upiId} <span>📋</span></span>
        </div>

        <div class="input-row">
          <label>Amount (₹)</label>
          <div class="input-wrap">
            <span class="prefix">₹</span>
            <input id="amountInput" type="number" min="1" step="1" placeholder="0" value="${initialAmount > 0 ? initialAmount : ''}" oninput="onAmountChange()"/>
          </div>
          <div class="quick-amounts">
            <button onclick="setAmount(100)">₹100</button>
            <button onclick="setAmount(500)">₹500</button>
            <button onclick="setAmount(1000)">₹1,000</button>
            <button onclick="setAmount(2000)">₹2,000</button>
            <button onclick="setAmount(5000)">₹5,000</button>
          </div>
        </div>

        <div class="input-row">
          <label>UTR / Transaction ID *</label>
          <div class="input-wrap">
            <input id="utrInput" class="no-prefix" placeholder="12-digit UTR from your UPI app"/>
          </div>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="submitPayment()">
          ✅ I've Paid — Submit
        </button>
      </div>

      <div class="option-row" onclick="switchMethod('dynamic',document.querySelector('[data-method=dynamic]'))">
        <div class="opt-icon">◫</div>
        <div class="opt-text">
          <div class="opt-title">UPI (Dynamic QR)</div>
          <div class="opt-desc">Generate a new QR code for this transaction</div>
        </div>
        <div class="arrow">›</div>
      </div>

      <div class="option-row" onclick="openIntent('any',event)">
        <div class="opt-icon">🔗</div>
        <div class="opt-text">
          <div class="opt-title">UPI (Redirect)</div>
          <div class="opt-desc">Pay via Paytm & Other UPI Apps</div>
        </div>
        <div class="arrow">›</div>
      </div>

      <div class="security-notice">
        <div class="shield">🛡</div>
        <div>
          <div class="text-1">Your payment is 100% secure</div>
          <div class="text-2">Powered by Payvora | Encrypted & Safe</div>
        </div>
      </div>
    </div>
  `;

  if(initialAmount > 0) updateDynamicQr(initialAmount);
}

function formatAmount(n){
  return Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function switchMethod(method, el){
  activeMethod = method;
  document.querySelectorAll(".method-tab").forEach(t=>t.classList.remove("active"));
  if(el) el.classList.add("active");
  
  const title = document.getElementById("qrTitle");
  const desc = document.getElementById("qrDesc");
  
  if(method === "static"){
    if(title) title.textContent = "Scan & Pay via UPI";
    if(desc) desc.textContent = "Use any UPI app to scan the QR code.";
    showToast("Static QR mode selected");
  } else if(method === "dynamic"){
    if(title) title.textContent = "Dynamic QR for this Transaction";
    if(desc) desc.textContent = "A new QR code is generated for this specific amount.";
    showToast("Dynamic QR mode selected");
  } else if(method === "redirect"){
    if(title) title.textContent = "Redirect to UPI App";
    if(desc) desc.textContent = "Tap 'Pay Now' to open your UPI app directly.";
    showToast("Redirect mode selected");
  }
}

function setAmount(v){
  const inp = document.getElementById("amountInput");
  if(!inp) return;
  inp.value = v;
  onAmountChange();
  inp.focus();
}

function onAmountChange(){
  const val = parseFloat(document.getElementById("amountInput").value) || 0;
  const big = document.getElementById("bigAmount");
  if(big) big.textContent = "₹" + formatAmount(val);
  updateDynamicQr(val);
}

function updateDynamicQr(amount){
  const holder = document.getElementById("qrHolder");
  if(!holder) return;

  const placeholder = holder.querySelector(".qr-placeholder");
  const existingCanvas = holder.querySelector("canvas");
  const existingImg = holder.querySelector("img");
  const centerLogo = holder.querySelector(".center-logo");

  if(existingCanvas) existingCanvas.remove();
  if(existingImg) existingImg.remove();

  if(!amount || amount <= 0){
    if(!placeholder){
      const ph = document.createElement("div");
      ph.className = "qr-placeholder";
      ph.textContent = "Enter amount to generate QR";
      holder.insertBefore(ph, centerLogo);
    } else {
      placeholder.style.display = "flex";
      placeholder.textContent = "Enter amount to generate QR";
    }
    return;
  }

  if(placeholder) placeholder.style.display = "none";

  const pa = SETTINGS.upiId;
  const pn = encodeURIComponent(SETTINGS.payeeName || "Merchant");
  const am = Number(amount).toFixed(2);
  const cu = "INR";
  const tn = encodeURIComponent("Payment for " + orderId);
  const upiLink = `upi://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${orderId}&tn=${tn}&cu=${cu}`;

  const qrDiv = document.createElement("div");
  qrDiv.style.position = "absolute";
  qrDiv.style.top = "50%";
  qrDiv.style.left = "50%";
  qrDiv.style.transform = "translate(-50%,-50%)";
  qrDiv.style.zIndex = "1";
  holder.appendChild(qrDiv);

  if(typeof QRCode === "undefined"){
    qrDiv.innerHTML = '<p style="color:#64748b;font-size:11px">QR library not loaded</p>';
    return;
  }

  try{
    new QRCode(qrDiv, {
      text: upiLink,
      width: 172,
      height: 172,
      colorDark: "#0a0a0a",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
    qrDiv.style.position = "relative";
    qrDiv.style.top = "auto";
    qrDiv.style.left = "auto";
    qrDiv.style.transform = "none";
    qrDiv.style.width = "172px";
    qrDiv.style.height = "172px";
    console.log("✅ QR generated for ₹" + amount);
  }catch(e){
    console.error("QR error:", e);
    qrDiv.innerHTML = '<p style="color:#64748b;font-size:11px">QR failed</p>';
  }
}

function openIntent(app, event){
  if(event) event.preventDefault();
  const amount = parseFloat(document.getElementById("amountInput").value) || 0;
  if(!amount || amount <= 0){
    showToast("Please enter amount first","error");
    return;
  }

  const pa = SETTINGS.upiId;
  const pn = encodeURIComponent(SETTINGS.payeeName || "Merchant");
  const am = amount.toFixed(2);
  const tr = orderId;
  const tn = encodeURIComponent("Payment for " + orderId);
  const cu = "INR";
  const upiLink = `upi://pay?pa=${pa}&pn=${pn}&am=${am}&tr=${tr}&tn=${tn}&cu=${cu}`;

  try{ window.location.href = upiLink; }catch(e){}

  setTimeout(() => {
    showToast("After paying, enter the UTR below","success");
    const utrEl = document.getElementById("utrInput");
    if(utrEl){ utrEl.scrollIntoView({behavior:"smooth",block:"center"}); utrEl.focus(); }
  }, 2500);
}

async function submitPayment(){
  const amount = parseFloat(document.getElementById("amountInput").value) || 0;
  const utr = document.getElementById("utrInput").value.trim();
  const btn = document.getElementById("submitBtn");

  if(!amount || amount <= 0) return showToast("Please enter amount first","error");
  if(!utr || utr.length < 6) return showToast("Please enter valid UTR (min 6 chars)","error");

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Submitting...';

  try{
    const depositId = await DB.push("deposits", {
      email: merchant,
      merchant: merchant,
      amount: amount,
      utr: utr,
      orderId: orderId,
      source: "checkout",
      method: activeMethod,
      status: "pending",
      at: new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})
    });
    if(!depositId) throw new Error("Could not save payment");
    showSuccess(utr, amount);
  }catch(e){
    console.error(e);
    btn.disabled = false;
    btn.innerHTML = '✅ I\'ve Paid — Submit';
    showToast("Error: " + e.message, "error");
  }
}

function showSuccess(utr, amount){
  const app = document.getElementById("app");
  app.style.gridTemplateColumns = "1fr";
  app.innerHTML = `
    <div class="success-wrap">
      <div class="success-icon">✓</div>
      <h2>Payment Submitted!</h2>
      <p>Your payment details have been received. The merchant will verify and confirm shortly.</p>

      <div class="order-box">
        <div class="row"><span class="lbl">Order ID</span><span class="val">${escapeHtml(orderId)}</span></div>
        <div class="row"><span class="lbl">Amount</span><span class="val" style="color:#6ee7b7;">₹${formatAmount(amount)}</span></div>
        <div class="row"><span class="lbl">UTR</span><span class="val" style="font-family:ui-monospace,monospace;font-size:12px;">${escapeHtml(utr)}</span></div>
        <div class="row"><span class="lbl">Status</span><span class="val" style="color:#fbbf24;">⏳ Pending Verification</span></div>
      </div>

      <p style="font-size:12px;color:var(--muted);max-width:440px;margin:0 auto 24px;">
        Please take a screenshot of this page for your records.
      </p>

      <button class="btn-close" onclick="window.close()">Close Window</button>
    </div>
  `;
  window.scrollTo(0,0);
}

function errorPage(title, msg){
  return `
    <div class="error-wrap">
      <div class="error-icon">✕</div>
      <h2>${title}</h2>
      <p>${msg}</p>
    </div>
  `;
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function copyText(text, el){
  navigator.clipboard.writeText(text).then(()=>{
    const orig = el.innerHTML;
    el.innerHTML = "✅ Copied!";
    setTimeout(()=>el.innerHTML = orig, 1500);
    showToast("Copied: " + text, "success");
  }).catch(()=>{ showToast("UPI ID: " + text); });
}

function showToast(m, t=""){
  const el = document.getElementById("toast");
  el.textContent = m;
  el.className = "toast show " + t;
  setTimeout(()=>el.className = "toast " + t, 3000);
}
</script>
